services:
  apicuron-ws:
    container_name: apicuron-webserver
    build:
      context: "./apicuron-ws"
      target: local
      args:
        - UID=${UID}
        - GID=${GID}
    image: "apicuron-ws:local"
    working_dir: "/home/node/app"
    # user: $DOCKER_USER
    volumes:
      - "./apicuron-ws:/home/node/app"
    networks:
      - apicuron-network
    logging:
      driver: "json-file"
      options:
        max-size: "5mb"
        max-file: "5"
    env_file:
      - .env
    # environment:
    #   - DATABASE_HOST=mongodb
    #   - DATABASE=apicuron_test
    #   - DB_PORT=27017
    #   - NODE_ENV=local
    # dns: 10.69.69.1
    # logging:
    #   driver: local
    #   options:
    #     max-size: '10m'
    #     max-file: 5
    command: "npm run start:dev"
    depends_on:
      - mongodb

  apicuron-ui:
    container_name: apicuron-ui
    build:
      context: "./apicuron-ui"
      target: local
      args:
        - UID=${UID}
        - GID=${GID}
    image: "apicuron-ui:local"
    working_dir: "/home/node/app"
    ports:
      - 4200:4200
    # image: "node:16.14"
    volumes:
      - "./apicuron-ui:/home/node/app"
    networks:
      - apicuron-network
    # dns: 10.69.69.1
    command: "npm run start-dev-external"

  proxy:
    container_name: apicuron-proxy
    image: nginx:stable-alpine-perl
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf"
    # - "./proxy/error.log:/var/log/nginx/error.log" TODO: Fix Bind mount issue,
    # nginx  automatically creates an error.log folder on ./proxy instead of a file and then fails to read it
    networks:
      - apicuron-network
    depends_on:
      - apicuron-ui
      - apicuron-ws
    # - apicuron-docs
    ports:
      - 3000:3000

  mongodb:
    container_name: apicuron-mongodb
    image: mongo:7
    volumes:
      - ./db:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d/
      - ./mongo/mongd.conf:/etc/mongod.conf:ro
    networks:
      - apicuron-network
    ports:
      - 27017:27017
    env_file:
      - .env

