services:
  apicuron-ws:
    container_name: apicuron-webserver
    build:
      context: "./apicuron-ws"
      target: local
      args:
        - UID=${UID}
        - GID=${GID}
    image: "apicuron-ws:local" 
    working_dir: "/home/node/app"
    # user: $DOCKER_USER
    volumes:
      - "./apicuron-ws:/home/node/app"
    networks:
      - apicuron-network
    logging:
      driver: "json-file"
      options:
        max-size: "5mb"
        max-file: "5"
    environment:
      - DATABASE_HOST=mongo-db
      - DATABASE=apicuron_test
      - DB_PORT=27017
      - NODE_ENV=local
    # dns: 10.69.69.1
    # logging:
    #   driver: local
    #   options:
    #     max-size: '10m'
    #     max-file: 5
    command: "npm run start:dev"
    depends_on:
      - mongo-db
    
  
  apicuron-ui:
    container_name: apicuron-ui
    build:
      context: "./apicuron-ui"
      target: local
      args:
        - UID=${UID}
        - GID=${GID}
    image: "apicuron-ui:local" 
    working_dir: "/home/node/app"
    # image: "node:16.14"
    volumes:
      - "./apicuron-ui:/home/node/app"
    networks:
      - apicuron-network
    # dns: 10.69.69.1
    command: "npm run start-dev-external"
  
  proxy:
    container_name: apicuron-proxy
    image: "nginx:latest"
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf"
    # - "./proxy/error.log:/var/log/nginx/error.log" TODO: Fix Bind mount issue,
    # nginx  automatically creates an error.log folder on ./proxy instead of a file and then fails to read it
    networks:
      - apicuron-network
    depends_on:
      - apicuron-ui
      - apicuron-ws
    # - apicuron-docs
    ports:
      - 3000:3000
  
  mongo-db:
    container_name: mongo-db
    image: mongo
    volumes:
      - ./db:/data/db
    networks:
      - apicuron-network
    ports:
      - 27017:27017
  
