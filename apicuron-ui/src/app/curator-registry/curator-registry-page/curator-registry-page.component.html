<div class="tw-mx-[7%] tw-p-2">
  <div *ngIf="users_list_response$ | async as users_list_response">
    <div class="tw-mt-5" *ngIf="entries$ | async as entries">
      <div
        class="tw-font-dm-sans tw-font-extrabold tw-my-4 tw-text-3xl tw-pl-2"
      >
        Contributors
      </div>
      <curator-search
        (urlStringEvent)="update_curator_list($event)"
      ></curator-search>
      <div
        class="tw-mt-5 tw-grid tw-gap-4 sm:tw-grid-cols-2 md:tw-grid-cols-3 lg:tw-grid-cols-4"
      >
        <div *ngFor="let entry of entries">
          <app-registry-card [entry]="entry"></app-registry-card>
        </div>
      </div>
      <div class="tw-grid tw-w-full tw-justify-center tw-m-4">
        <pagination [paginated]="users_list_response" (pageChanged)="pageChanged($event)"></pagination>
      </div>
    </div>
  </div>
</div>
