<ng-container *ngIf="curator$ | async as curator">
  <!-- Who the person is: full-width band right under the navbar -->
  <profile-header [user]="curator"></profile-header>

  <div class="tw-mx-auto tw-max-w-7xl tw-px-4 sm:tw-px-8 2xl:tw-px-0 tw-pt-6 tw-pb-10">
    <!-- BIP! Scholar indicators stay on top of the resources -->
    <app-bip-scores-grid [orcidId]="orcidId$ | async"></app-bip-scores-grid>

    <ng-container *ngIf="entries$ | async as entries">
      <div class="tw-flex tw-flex-col tw-gap-4">
        <!-- Resource tabs, only when there is something to choose -->
        <nav
          *ngIf="entries.length > 1"
          aria-label="Resources"
          class="tw-flex tw-flex-row tw-gap-1 tw-overflow-x-auto tw-border-b tw-border-slate-200"
        >
          <button
            type="button"
            class="tw-px-3 tw-py-2 tw-text-sm tw-whitespace-nowrap tw-border-b-2 tw--mb-px"
            [ngClass]="
              selectedId === null
                ? 'tw-border-apicuron-purple tw-text-gray-900 tw-font-semibold'
                : 'tw-border-transparent tw-text-slate-500 hover:tw-text-slate-800'
            "
            [attr.aria-current]="selectedId === null ? 'page' : null"
            (click)="select(null)"
          >
            All resources
          </button>
          <button
            *ngFor="let entry of entries; trackBy: trackEntry"
            type="button"
            class="tw-inline-flex tw-items-center tw-gap-2 tw-px-3 tw-py-2 tw-text-sm tw-whitespace-nowrap tw-border-b-2 tw--mb-px"
            [ngClass]="
              selectedId === entry.resourceId
                ? 'tw-border-apicuron-purple tw-text-gray-900 tw-font-semibold'
                : 'tw-border-transparent tw-text-slate-500 hover:tw-text-slate-800'
            "
            [ngStyle]="
              selectedId === entry.resourceId && entry.resource?.color
                ? { 'border-color': entry.resource?.color }
                : {}
            "
            [attr.aria-current]="selectedId === entry.resourceId ? 'page' : null"
            (click)="select(entry.resourceId)"
          >
            <span
              class="tw-h-2 tw-w-2 tw-rounded-full tw-bg-slate-400"
              [ngStyle]="{ 'background-color': entry.resource?.color }"
            ></span>
            {{ entry.resource?.resource_name ?? entry.resourceId }}
            <span class="tw-text-xs tw-font-normal tw-text-slate-400">{{
              entry.statistics.total_count | number
            }}</span>
          </button>
        </nav>

        <ng-container *ngFor="let entry of entries; trackBy: trackEntry">
          <curator-stat-card
            *ngIf="isShown(entry)"
            [statistics]="entry.statistics"
            [curator]="curator"
            [resource]="entry.resource ?? undefined"
          ></curator-stat-card>
        </ng-container>
      </div>
    </ng-container>
  </div>
</ng-container>
