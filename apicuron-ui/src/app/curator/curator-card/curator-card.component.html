<div [ngClass]="{'tw-flex-row': !vertical, 'tw-flex-col': vertical}"
    class="tw-flex tw-items-center tw-flex-wrap tw-bg-white tw-rounded-lg tw-pt-2 tw-h-full">
    <div [ngClass]="{'tw-p-2': !vertical}">
        <!-- <img [ngClass]="{'tw-w-24 tw-h-24': vertical, 'tw-w-20 tw-h-20': !vertical, 'tw-rounded-full tw-bg-gray-50 tw-border-2 tw-border-gray-100 tw-text-gray-800': true}" [src]="'https://api.dicebear.com/5.x/identicon/svg?scale=80&radius=50&seed=' + displayedName" alt=""> -->
        <img [ngClass]="{'tw-w-24 tw-h-24': vertical, 'tw-w-20 tw-h-20': !vertical, 'tw-rounded-full tw-bg-gray-50 tw-border-2 tw-border-gray-100 tw-text-gray-800': true}"
            [src]="biocurator.generate_avatar()" alt="">
    </div>
    <div class="tw-flex tw-flex-col" [ngClass]="{'tw-items-center': vertical, 'tw-ml-2': !vertical}">
        <div class="tw-gap-2">
            <a [routerLink]="['/curators', orcid_id]"
                class="tw-text-xl tw-font-dm-sans tw-text-gray-900 hover:tw-text-gray-900 tw-font-bold hover:tw-underline tw-truncate">{{
                displayedName
                }}
            </a>
            <a [href]="biocurator.orcid_url()" target="_blank" class="tw-cursor-pointer tw-align-top">
                <img class="tw-inline tw-h-6 tw-w-6" src="https://orcid.org/assets/vectors/orcid.logo.icon.svg" alt=""
                    role="tooltip">
            </a>

        </div>
        <ng-container *ngIf="display_achievement_counts && single_resource()">
            <div
                class="tw-pt-1 tw-pb-2 tw-flex tw-flex-row tw-items-center tw-text-gray-400">
                <div>
                    <svg class="tw-h-4 tw-w-4 tw-inline" viewBox="0 0 13 17" fill="currentColor"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M0.0759903 0.656951C-0.108186 0.387653 0.0640529 0 0.360782 0H4.02044C4.24681 0.0028959 4.457 0.118565 4.58149 0.30875L5.75988 2.02403L3.38946 5.48889L0.0759903 0.656951ZM6.5 16.4667C2.24568 16.4667 0.11588 11.2934 3.12377 8.26798C6.13167 5.24256 11.2749 7.38477 11.2749 11.6639C11.2749 14.3164 9.13713 16.4667 6.5 16.4667ZM6.5 5.65184C7.39947 5.65079 8.28747 5.85488 9.09723 6.24876L12.924 0.656951C13.1082 0.387653 12.9359 0 12.6392 0H8.97956C8.75319 0.0028959 8.543 0.118565 8.41851 0.30875L4.53375 5.98632C5.16582 5.76449 5.83055 5.65141 6.5 5.65184Z"
                            fill="currentColor" />
                    </svg>
                    <span>{{ medal_count }}</span>
                </div>
                <div class="tw-ml-2">
                    <svg class="tw-h-4 tw-w-4 tw-inline" viewBox="0 0 14 19" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M9.59756 13.6969L10.3615 13.7392V19L6.99637 17.0513L3.63127 19V13.7392L4.39519 13.6969C4.65627 13.6827 4.91252 13.7627 5.11559 13.9249L5.87709 14.529C6.20103 14.7852 6.59991 14.9145 6.99637 14.9145C7.39284 14.9145 7.79172 14.7852 8.11566 14.529L8.87716 13.9249C9.08022 13.765 9.33164 13.6827 9.59756 13.6969ZM6.99637 3.36089C4.87384 3.36089 3.14778 5.03928 3.14778 7.10318C3.14778 9.16708 4.87384 10.8455 6.99637 10.8455C9.1189 10.8455 10.845 9.16708 10.845 7.10318C10.845 5.03928 9.1189 3.36089 6.99637 3.36089ZM13.9296 8.61702C14.1085 9.066 13.9369 9.57845 13.5211 9.83938L12.6943 10.3565C12.322 10.5892 12.0537 10.9466 11.9425 11.365L11.6911 12.2888C11.5654 12.7542 11.1157 13.0716 10.6226 13.0434L9.64108 12.9893C9.19626 12.9658 8.76595 13.1021 8.42268 13.3748L7.66118 13.9789C7.27922 14.2822 6.7232 14.2822 6.33882 13.9789L5.57732 13.3748C5.26064 13.1233 4.86659 12.9869 4.45804 12.9869C4.4242 12.9869 4.39035 12.9869 4.35892 12.9893L3.37744 13.0434C2.88186 13.0716 2.43463 12.7519 2.30892 12.2888L2.0575 11.365C1.94388 10.9489 1.67796 10.5916 1.30567 10.3565L0.478902 9.83938C0.0630989 9.57845 -0.108541 9.066 0.0703511 8.61702L0.425718 7.72611C0.58527 7.32415 0.58527 6.88222 0.425718 6.48025L0.0703511 5.58934C-0.108541 5.14036 0.0630989 4.62791 0.478902 4.36699L1.30567 3.84983C1.67796 3.61712 1.9463 3.25981 2.0575 2.84139L2.30892 1.91757C2.43463 1.45214 2.88186 1.13479 3.37744 1.163L4.35892 1.21707C4.7989 1.24057 5.23405 1.10423 5.57732 0.831555L6.33882 0.227429C6.72078 -0.0758096 7.2768 -0.0758096 7.66118 0.227429L8.42268 0.831555C8.76595 1.10423 9.19868 1.24057 9.64108 1.21707L10.6226 1.163C11.1157 1.13714 11.5654 1.45449 11.6911 1.91757L11.9425 2.84139C12.0561 3.25746 12.322 3.61477 12.6943 3.84983L13.5211 4.36699C13.9369 4.62791 14.1085 5.14036 13.9296 5.58934L13.5743 6.48025C13.4147 6.88222 13.4147 7.32415 13.5743 7.72611L13.9296 8.61702ZM11.5702 7.10318C11.5702 4.65142 9.51778 2.65569 6.99637 2.65569C4.47496 2.65569 2.42254 4.65142 2.42254 7.10318C2.42254 9.55495 4.47496 11.5507 6.99637 11.5507C9.51778 11.5507 11.5702 9.55495 11.5702 7.10318Z"
                            fill="#9CA3AF" />
                    </svg>
                    <span>{{ badge_count }}</span>
                </div>

            </div>
            <div class="tw-text-gray-400">
                Score: <span class="tw-font-bold">{{ total_score }}</span>
            </div>
        </ng-container>

        <div *ngIf="display_resources" class="tw-pt-1 tw-pb-2" [ngClass]="{'tw-max-w-lg': vertical}">
            <span *ngIf="!vertical"
                class="tw-text-gray-400 tw-font-bold tw-uppercase tw-text-sm tw-mr-2">resources</span>
            <ng-container *ngIf="resources$ | async as converter">
                <!-- if the element is the last, output empty string otherwise, output a comma -->

                <a *ngFor="let resource of resources; let last= last" [routerLink]="['/databases', resource ]"
                    class="tw-text-gray-700 tw-cursor-pointer hover:tw-text-gray-800 tw-font-bold tw-text-sm tw-rounded-2xl tw-mr-1 hover:tw-underline">{{
                    converter[resource] }}{{ last ? '' : ',' }}</a>

            </ng-container>
            <!-- <a
                class="tw-bg-apicuron-purple tw-text-gray-100 tw-cursor-pointer hover:tw-text-white tw-font-bold tw-text-xs tw-rounded-2xl tw-p-1 tw-mr-1">Disprot</a> -->
        </div>
    </div>
    <div *ngIf="display_scores"
        class="tw-w-full tw-flex tw-flex-row tw-flex-wrap tw-justify-center tw-border-t-2 tw-border-gray-100 tw-mt-2 md:tw-mt-auto">
        <div class="tw-w-1/2 sm:tw-w-1/3 tw-text-center tw-border-gray-500 tw-p-1 md:tw-p-1 tw-justify-se">
            <span class="tw-text-xs tw-uppercase tw-font-bold tw-text-gray-400">
                generation Score
            </span>
            <span class="tw-block tw-text-lg tw-font-bold tw-text-gray-800">{{ generation_score }}</span>
        </div>
        <div class="tw-w-1/2 sm:tw-w-1/3 tw-text-center sm tw-border-gray-500 tw-p-1 md:tw-p-1">
            <span class="tw-text-xs tw-uppercase tw-font-bold tw-text-gray-400">
                revision Score
            </span>
            <span class="tw-block tw-text-lg tw-font-bold tw-text-gray-800">{{ revision_score }}</span>
        </div>
        <div class="tw-w-1/2 sm:tw-w-1/3 tw-text-center tw-p-1 md:tw-p-1 sm:tw-border-0">
            <span class="tw-text-xs tw-uppercase tw-font-bold tw-text-gray-400">
                invalidation Score
            </span>
            <span class="tw-block tw-text-lg tw-font-bold tw-text-gray-800">{{ invalidation_score
                }}</span>
        </div>
    </div>

</div>
