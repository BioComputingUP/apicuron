<div>
  <div
    class="tw-flex tw-items-center tw-space-x-4 tw-bg-white tw-shadow tw-rounded-lg tw-p-2 tw-px-2 tw-mb-2"
  >
    <!-- Profile Image -->
    <div class="tw-flex tw-flex-row tw-items-center">
      <span
        [ngClass]="{
                'tw-bg-yellow-300 tw-text-yellow-900': medal.state == 'achieved',
                ' tw-rounded-md tw-text-gray-700': medal.state == 'progress',
            }"
        class="tw-px-2 tw-py-1 tw-mr-2 tw-rounded tw-text-xs tw-font-semibold"
      >
        <!-- [Ranking/Position] -->
        {{ medal.score_relative_index + 1 }}
      </span>
      <div
        class="tw-w-10 tw-h-10 tw-rounded-full tw-p-2 tw-bg-gray-200 tw-flex tw-items-center tw-justify-center tw-text-gray-400 tw-text-2xl tw-self-start"
      >
        <img
          [src]="medal?.user?.avatar?.href ?? 'assets/user.svg'"
          class="tw-w-full tw-h-full"
          alt=""
          srcset=""
        />
      </div>
    </div>
    <!-- Profile Info -->
    <div class="tw-flex-1">
      <div class="">
        <!-- [Person's Name] -->
        <span class="tw-font-bold tw-text-sm tw-text-gray-800">
          {{ medal?.user?.displayedName || "Unregistered User" }}
        </span>
        <span
          *ngIf="!medal.hasUser"
          class="tw-inline tw-font-medium tw-text-xs tw-text-gray-500 tw-ml-1 tw-px-1 tw-border tw-border-slate-400 tw-rounded-full"
        >
          No Profile on APICURON
        </span>
      </div>
      <div class="tw-text-sm tw-text-gray-500 tw-my-1">
        <!-- [Badge Name] -->
        Earned The Medal:
        <span class="tw-text-gray-500">{{ medal.name }}</span>
      </div>
      <div class="tw-flex tw-items-center tw-space-x-2 tw-mt-2">
        <span class="tw-text-xs tw-text-gray-400">
          <!-- [Additional Info] -->

          <a
            [href]="orcid_main_url + medal.curator_orcid"
            target="_blank"
            title="Visit ORCID Profile"
            class="hover:tw-underline tw-text-blue-500"
          >
            {{ medal.curator_orcid }}
            <svg-icon
              svgClass="tw-w-4 tw-h-4 tw-inline"
              src="assets/svg/external-link.svg"
            ></svg-icon>
          </a>
        </span>
      </div>
    </div>
    <!-- Badge Icon -->
    <div
      class="tw-w-10 tw-h-10 tw-rounded-fulltw-flex tw-items-center tw-justify-center tw-text-xl"
    >
      <!-- [Badge Icon] -->
      <img
        src="assets/svg/gold_medal.svg"
        [ngClass]="{ 'tw-grayscale': medal.state == 'progress' }"
        alt="Medal icon"
        srcset=""
      />
    </div>
  </div>
</div>
