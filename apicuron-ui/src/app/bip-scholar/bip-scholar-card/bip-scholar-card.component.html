<ng-container *ngIf="stats_section_info as section">
  <h3
    class="tw-mb-3 tw-text-xs tw-font-semibold tw-uppercase tw-tracking-wider tw-text-slate-500"
  >
    {{ section.title }}
  </h3>
  <dl class="tw-grid tw-grid-cols-2 tw-gap-x-4 tw-gap-y-3">
    <div
      *ngFor="let stat of section.stats | keyvalue: keepOrder"
      class="tw-cursor-help"
      [title]="stat.value.description"
    >
      <dd class="tw-text-lg tw-font-semibold tw-text-gray-900 tw-tabular-nums">
        {{ stat.value.value | number }}
      </dd>
      <dt class="tw-text-xs tw-leading-snug tw-text-slate-500">
        {{ stat.value.label }}
      </dt>
    </div>
  </dl>
</ng-container>
