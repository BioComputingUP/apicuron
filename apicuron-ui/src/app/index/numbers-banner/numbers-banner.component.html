<div
  class="tw-bg-gradient-to-r tw-from-apicuron-purple tw-to-apicuron-red tw-p-2 md:tw-p-4"
>
  <h2
    class="tw-text-center tw-font-bold tw-text-white tw-text-xl md:tw-text-2xl lg:tw-text-3xl tw-font-dm-sans tw-uppercase"
  >
    APICURON in numbers
  </h2>
  <div
    class="tw-mx-auto tw-max-w-7xl tw-flex tw-flex-row tw-flex-wrap tw-justify-center tw-py-2 md:tw-py-4 lg:tw-pt-6 lg:tw-pb-4"
    *ngIf="numberElements$ | async as numberElements"
  >
    <div
      *ngFor="let numberElement of numberElements"
      class="lg:tw-w-1/4 md:tw-w-1/3 tw-w-1/2 tw-mb-2 sm:tw-mb-0"
    >
      <app-number-element
        [count]="numberElement.count"
        [text]="numberElement.text"
      >
        <svg-icon
          svgClass="tw-h-14 md:tw-h-24 lg:tw-h-42 tw-text-white"
          [src]="numberElement.icon"
        ></svg-icon>
      </app-number-element>
    </div>
  </div>

  <!-- Partner resources per output type -->
  <p
    *ngIf="resources?.length && categoryCounts.length"
    class="tw-mx-auto tw-mb-2 tw-w-fit tw-max-w-full tw-rounded-full tw-bg-white/15 tw-px-4 tw-py-1.5 tw-text-center tw-text-sm md:tw-text-base tw-text-white"
  >
    {{ resources?.length }} partner resources:
    <ng-container *ngFor="let category of categoryCounts; let last = last">
      <span class="tw-whitespace-nowrap"
        ><span class="tw-font-semibold">{{ category.count }}</span>
        {{ category.label }}</span
      ><ng-container *ngIf="!last"> · </ng-container>
    </ng-container>
  </p>
</div>
