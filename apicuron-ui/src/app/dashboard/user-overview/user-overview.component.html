<div *ngIf="user$ | async as user" class="tw-p-1 sm:tw-p-2">
    <h2 class="tw-text-lg lg:tw-text-xl tw-font-bold tw-font-dm-sans">Welcome {{ user.displayedName }}</h2>

    <div class="tw-flex tw-flex-row tw-items-stretch tw-h-auto">
        <div class="tw-w-full sm:tw-w-2/3 tw-p-1 tw-block">
            <!-- reports bar chart card -->
            <div class="tw-p-1 tw-rounded tw-shadow-md tw-shadow-gray-500 tw-bg-white">
                <div class="tw-w-full tw-px-2">
                    <div>
                        <h3
                            class="tw-text-md sm:tw-text-lg tw-font-dm-sans tw-font-bold tw-tracking-wide tw-capitalize">
                            My
                            Contributions</h3>
                        <div>
                            <form class="tw-w-full tw-flex tw-flex-row tw-justify-end tw-gap-2"
                                [formGroup]="reportsChartForm" action="">
                                <div>
                                    <label class="tw-text-sm tw-font-bold tw-text-gray-700 tw-mr-1"
                                        for="from">from</label>
                                    <p-calendar p-datepicker="tw-bg-white tw-rounded tw-shadow-gray-700"
                                        formControlName="from"
                                        [maxDate]="reportsChartForm.controls.to.value"></p-calendar>
                                </div>
                                <div>
                                    <label class="tw-text-sm tw-font-bold tw-text-gray-700 tw-mr-1" for="to">to</label>
                                    <p-calendar formControlName="to" [maxDate]="maxTo"
                                        [minDate]="reportsChartForm.controls.from.value"></p-calendar>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <ng-container *ngIf="chartData$ | async as chartData">
                    <div class="tw-w-full tw-overflow-hidden">
                        <reports-by-date-chart [resources]="chartData[0]" [reportsData]="chartData[1]"
                            [reportFilter]="chartData[2]"></reports-by-date-chart>
                    </div>
                </ng-container>

            </div>
        </div>

        <div class="tw-w-1/2 sm:tw-w-1/3 tw-p-1 tw-block">
            <!-- reports category chart -->
            <div class="tw-py-1 tw-px-2 tw-rounded tw-shadow-md tw-shadow-gray-500 tw-bg-white tw-h-full">
                <h3 class="tw-text-md sm:tw-text-lg tw-font-dm-sans tw-font-bold tw-tracking-wide tw-capitalize">
                    Contributions
                    By Category </h3>
                <div class="tw-w-full tw-flex tw-flex-row tw-flex-wrap" *ngIf="statistics$ | async as stats">
                    <div class="tw-w-full tw-px-2" *ngIf="resources$ | async as resources">
                        <select [formControl]="selectedResource"
                            class="tw-w-full tw-py-1 tw-mt-1 tw-bg-gray-100 tw-text-gray-700 focus:tw-ring-0">
                            <option *ngFor="let res of resources" [value]="res.resource_id"
                                [ngStyle]="{ color: res.color }" class="focus:tw-ring-0">{{ res.resource_name }}
                            </option>
                        </select>
                    </div>
                    <div class="tw-w-full" *ngIf="currResourceStat$ | async as currResourceStat">
                        <categories-pie-chart [statistics]="currResourceStat"></categories-pie-chart>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
