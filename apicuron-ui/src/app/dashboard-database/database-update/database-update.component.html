<div
  class="tw-px-10 tw-pt-6 tw-flex-auto"
  *ngIf="resource$ | async as resource"
>
  <form (ngSubmit)="submit()" [formGroup]="form">
    <div class="tw-flex tw-items-center tw-justify-between">
      <span class="tw-text-xl tw-font-bold"
        >Update {{ resource["resource_name"] }}</span
      >
      <div class="tw-flex">
        <input
          type="submit"
          [value]="'Update ' + resource['resource_name']"
          [disabled]="form.invalid || !form.dirty"
          class="tw-font-bold tw-p-2 focus:tw-ring-1 tw-ring-purple-900 tw-rounded-md disabled:tw-bg-gray-300 disabled:tw-text-gray-600 enabled:tw-bg-apicuron-purple enabled:tw-text-white enabled:tw-shadow-md enabled:tw-cursor-pointer"
        />
      </div>
    </div>

    <div class="tw-flex tw-flex-row tw-gap-4">
      <!-- left section -->
      <div class="tw-w-full sm:tw-w-1/2">
        <div class="form-control-element">
          <label for="resource_name">Resource Name</label>
          <input type="text" formControlName="resource_name" />
          <small
            class="tw-text-red-500 tw-text-sm tw-font-light"
            *ngIf="resource_name.hasError('required') && resource_name.touched"
          >
            The Resource Name is required
          </small>
        </div>

        <div class="form-control-element">
          <label for="resource_long_name">Resource Long Name</label>
          <input type="text" formControlName="resource_long_name" />
          <small
            class="tw-text-red-500 tw-text-sm tw-font-light"
            *ngIf="
              resource_long_name.hasError('required') &&
              resource_long_name.touched
            "
          >
            The Resource Long Name is required
          </small>
        </div>

        <div class="form-control-element">
          <label for="resource_long_name">Resource Color</label>
          <input type="text" formControlName="color" />
          <small
            class="tw-text-red-500 tw-text-sm tw-font-light"
            *ngIf="color.hasError('required') && color.touched"
          >
            The Resource URI Name is required
          </small>
        </div>

        <div class="form-control-element">
          <label for="resource_description">Resource Description</label>
          <textarea
            class="text-input"
            name="resource_description"
            formControlName="resource_description"
            id="resource_description_textarea"
            cols="30"
            rows="10"
          ></textarea>
          <small
            class="tw-text-red-500 tw-text-sm tw-font-light"
            *ngIf="
              resource_description.hasError('required') &&
              resource_description.touched
            "
          >
            The Resource Description is required
          </small>
        </div>
      </div>

      <!-- right section -->
      <div class="tw-w-full sm:tw-w-1/2">
        <div class="form-control-element">
          <label for="resource_url">Resource URL</label>
          <input type="text" formControlName="resource_url" />
          <small
            class="tw-text-red-500 tw-text-sm tw-font-light"
            *ngIf="resource_url.hasError('required') && resource_url.touched"
          >
            The Resource URL is required
          </small>
        </div>

        <div class="form-control-element">
          <label for="resource_long_name">Resource URI</label>
          <input type="text" formControlName="resource_uri" />
          <small
            class="tw-text-red-500 tw-text-sm tw-font-light"
            *ngIf="resource_uri.hasError('required') && resource_uri.touched"
          >
            The Resource URI Name is required
          </small>
        </div>

        <div class="form-control-element">
          <label>Upload Resource Logo</label>

          <div
            class="tw-bg-white tw-border-gray-300 tw-rounded tw-border tw-p-4 tw-flex tw-flex-col tw-gap-2"
          >
            <div class="tw-w-1/2">
              <span
                class="tw-text-base tw-font-bold tw-text-gray-700 tw-my-1 sm:tw-my-2"
              >
                Logo Preview:
              </span>
              <div
                class="tw-flex tw-justify-center tw-items-center tw-m-1"
                *ngIf="logoLink$ | async as logoLink"
              >
                <img
                  class="tw-max-w-full tw-w-32 sm:tw-w-48 xl:tw-w-64"
                  [src]="logoLink"
                  alt=""
                />
              </div>
            </div>
            <div class="tw-flex tw-justify-center tw-mt-2">
              <input
                #fileInput
                type="file"
                class="tw-hidden"
                (change)="onFileSelected($event)"
                id=""
              />
              <button
                type="button"
                (click)="fileInput.click()"
                class="tw-font-bold tw-px-4 tw-p-2 focus:tw-ring-1 tw-rounded-md tw-bg-purple-100 tw-text-apicuron-purple-500 tw-flex tw-items-center"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="tw-h-5 tw-w-5 tw-mr-2"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 4v16m8-8H4"
                  ></path>
                </svg>
                <span>Upload Image</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <hr />
    <label for="totalLeaderBoardPreferences"
      >Total Leader Board Preferences</label
    >
    <preference-selector
      [preferences]="allTotalLeaderBoardPreferences"
      formControlName="totalLeaderBoardPreferences"
    >
    </preference-selector>
  </form>
</div>

<p-toast></p-toast>
