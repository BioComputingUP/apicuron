<div class="tw-bg-white tw-rounded-md tw-shadow-lg tw-p-1 md:tw-p-2 tw-text-gray-700" style="font-family: system-ui;"
    *ngIf="resource$ | async as resource">
    <h2 class="tw-font-bold tw-text-xl md:tw-text-2xl">
        {{ resource.resource_name }} Leaderboard
    </h2>
    <div class="tw-flex tw-flex-col tw-overflow-x-auto" *ngIf="statsWithUsers$ | async as statsWithUsers; else loading">





        <table class="tw-table-auto">
            <thead>
                <tr class="tw-divide-x tw-divide-gray-200">
                    <th>Curator</th>
                    <th *ngFor="let column of tableColumns">
                        {{ getColumnProps(column).name }}
                    </th>

                </tr>
            </thead>
            <tbody class="tw-divide-y tw-divide-gray-200">
                <tr *ngFor="let entry of statsWithUsers" class="odd:tw-bg-gray-50">
                    <!-- <td>
                        <div
                            class="tw-overflow-hidden tw-w-12 tw-h-12 tw-rounded-full tw-border-2 tw-border-apicuron-bright-purple">
                            <img [src]="entry.user.generate_avatar()" class="tw-w-full" alt="">
                        </div>
                    </td> -->

                    <td>

                        <div class="tw-flex tw-flex-row tw-ml-1 md:tw-ml-2 tw-items-center">
                            <div
                                class="tw-overflow-hidden tw-w-12 tw-h-12 tw-rounded-full tw-border-2 tw-border-apicuron-bright-purple tw-mr-2">
                                <img [src]="entry.user.generate_avatar()" class="tw-w-full" alt="">
                            </div>
                            <a class="tw-text-lg tw-block hover:tw-underline tw-whitespace-pre"
                                [href]="apicuronURL + '/curators/' + entry.user.orcid_id ">
                                <span>{{ entry.user.displayedName }}</span>

                                <svg class="tw-h-4 tw-w-4 tw-inline tw-ml-1" version="1.1" viewBox="0 0 1200 1200"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <g>

                                        <path
                                            d="m805.66 181.05h88.008 140.16 31.992c24.492 0 48.047-21.562 46.875-46.875-1.1719-25.43-20.625-46.875-46.875-46.875h-88.008-140.16-31.992c-24.492 0-48.047 21.562-46.875 46.875 1.1719 25.43 20.625 46.875 46.875 46.875z" />
                                        <path
                                            d="m1112.7 394.34v-88.008-140.16-31.992c0-24.492-21.562-48.047-46.875-46.875-25.43 1.1719-46.875 20.625-46.875 46.875v88.008 140.16 31.992c0 24.492 21.562 48.047 46.875 46.875 25.43-1.1719 46.875-20.625 46.875-46.875z" />

                                            d="m634.1 632.23c15.469-15.469 31.055-31.055 46.523-46.523 36.914-36.914 73.945-73.945 110.86-110.86 44.648-44.648 89.297-89.297 134.06-134.06 38.789-38.789 77.461-77.461 116.25-116.25 18.75-18.75 37.852-37.383 56.367-56.367 0.23438-0.23437 0.46875-0.46875 0.82031-0.82031 17.344-17.344 18.633-49.219 0-66.328-18.75-17.227-47.812-18.516-66.328 0-15.469 15.469-31.055 31.055-46.523 46.523-36.914 36.914-73.945 73.945-110.86 110.86-44.648 44.648-89.297 89.297-134.06 134.06-38.789 38.789-77.461 77.461-116.25 116.25-18.75 18.75-37.852 37.383-56.367 56.367-0.23438 0.23438-0.46875 0.46875-0.82031 0.82031-17.344 17.344-18.633 49.219 0 66.328 18.75 17.109 47.812 18.516 66.328 0z" />
                                    </g>
                                </svg>
                            </a>

                            <a [href]="'https://orcid.org/' + entry.user.orcid_id"
                                class="tw-block tw-w-6 tw-h-6 tw-ml-1 md:tw-ml-2">
                                <img src="https://orcid.org/assets/vectors/orcid.logo.icon.svg" class="tw-w-6 tw-h-6"
                                    alt="">
                            </a>
                        </div>


                    </td>
                    <td class="tw-text-center tw-font-bold tw-text-gray-700" *ngFor="let column of tableColumns">
                        {{ entry.stat[column] }}
                    </td>
                </tr>
            </tbody>
        </table>



    </div>

    <ng-template #loading>
        <div class="tw-h-32 tw-flex tw-justify-center tw-flex-row">
            <svg class="tw-w-24 tw-h-24 tw-text-apicuron-purple tw-animate-spin" version="1.1" viewBox="0 0 1200 1200"
                xmlns="http://www.w3.org/2000/svg">
                <path fill="currentColor"
                    d="m610.95 305.61-35.434 3.0469c-157.92 13.16-277.3 150.43-268.52 308.66 8.7773 158.22 142.78 281.21 301.18 276.82 158.41-4.3906 285.12-134.69 285.12-293.15v-35.434h-70.867v35.434c0 120.86-95.383 218.94-216.2 222.29-120.82 3.3438-221.68-89.434-228.38-210.11-6.6953-120.68 83.297-223.88 203.74-233.91l35.156-3.0469z" />
            </svg>
        </div>

    </ng-template>
    <div class="tw-flex tw-flex-row tw-justify-between tw-items-center tw-pt-2 md:tw-pt-4">
        <div *ngIf="statsMeta$ | async as statsMeta">
            Total Contributors: <span
                class="tw-bg-apicuron-bright-purple tw-text-white tw-font-bold tw-rounded-md tw-px-1">{{ statsMeta.pagination.total }}</span>
        </div>
        <!-- pagination -->
        <div *ngIf="statsMeta$ | async as meta">
            <div class="tw-inline-flex tw-justify-center tw-gap-1">
                <button (click)="prevPage()" [disabled]="page.value == 1"
                    class="tw-inline-flex tw-h-8 disabled:tw-text-gray-400 tw-w-8 tw-items-center tw-justify-center tw-rounded tw-border tw-border-gray-100 tw-bg-white tw-text-gray-900 rtl:tw-rotate-180">
                    <span class="tw-sr-only">Prev Page</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="tw-h-3 tw-w-3 tw-text-inherit" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
                            clip-rule="evenodd"></path>
                    </svg>
                </button>

                <div>
                    <label for="PaginationPage" class="tw-sr-only">Page</label>

                    <input type="number" [formControl]="page"
                        class="tw-h-8 tw-w-12 tw-rounded tw-border tw-border-gray-100 tw-bg-white tw-p-0 tw-text-center tw-text-xs tw-font-medium tw-text-gray-900 moz-appearance:tw-_textfield] webkit-inner-spin-button]:tw-m-0 webkit-inner-spin-button]:tw-appearance-none webkit-outer-spin-button]:tw-m-0 webkit-outer-spin-button]:tw-appearance-none tw-outline-none"
                        min="1" [max]="meta.pagination.total / meta.pagination.limit">
                </div>

                <button (click)="nextPage()" [disabled]="page.value >= meta.pagination.total / meta.pagination.limit"
                    class="tw-inline-flex tw-h-8 tw-w-8 tw-items-center tw-justify-center tw-rounded tw-border tw-border-gray-100 tw-bg-white tw-text-gray-900 rtl:tw-rotate-180">
                    <span class="tw-sr-only">Next Page</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="tw-h-3 tw-w-3" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                            clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
        </div>
        <a href="https://apicuron.org">
            <img class="tw-w-48 tw-transition-transform hover:tw-scale-110 "
                src="https://apicuron.org/assets/APICURON.svg" alt="">
        </a>
    </div>
</div>
