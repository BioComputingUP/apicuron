# Logs go to the host journal so they survive `up --force-recreate` in run-prod.sh
x-logging: &logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  apicuron-webserver:
    container_name: apicuron-webserver-dev
    logging: *logging
    image: registry.biocomputingup.it/apicuron-ws:dev
    env_file:
      - .env.development
    restart: "unless-stopped"
    depends_on:
      - mongodb
      

  
  apicuron-proxy-ui:
    image: registry.biocomputingup.it/apicuron-ui:dev    
    container_name: apicuron-proxy-ui-dev
    logging: *logging
    env_file:
      - .env.development
    restart: "unless-stopped"
    ports:
      - 8189:8080
    depends_on:
      - apicuron-webserver
  
  mongodb:
    image: registry.biocomputingup.it/apicuron-db:dev
    container_name: apicuron-mongo-dev
    logging: *logging
    restart: always
    ports:
      - 27016:27017
    volumes:
      - mongo-data:/data/db
    env_file:
      - .env.development

volumes:
  mongo-data:
    name: apicuron-dev-mongo-data
  

