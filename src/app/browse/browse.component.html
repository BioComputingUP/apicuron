<div class="container-fluid container-wide">
  <div class="row" *ngIf="loading_finished">
    <div class="col" >
      <table cdk-table [dataSource]="dataOnPage" class="table table-sm table-responsive-sm">
        <tr cdk-header-row *cdkHeaderRowDef="displayedColumns"></tr>
        <tr cdk-row *cdkRowDef="let row; columns: displayedColumns"></tr>

        <ng-container cdkColumnDef="entry_id">
          <th cdk-header-cell *cdkHeaderCellDef (click)="adjustSort('entry_id')">
            ORCID iD
            <span *ngIf="sortKey.value === 'entry_id'">
                {{ sortDirection.value === 'asc' ? '↥' : '↧' }}
              </span>
          </th>
          <td cdk-cell *cdkCellDef="let row" class=" pr-0">
<!--            <a class="btn-block"-->
<!--               [routerLink]="['/orcid/' + row['curator_orcid']]"-->
<!--            >-->
              {{row['orcid']}}
<!--            </a>-->
          </td>
        </ng-container>
        <ng-container cdkColumnDef="name">
          <th cdk-header-cell *cdkHeaderCellDef (click)="adjustSort('name')">
            ORCID iD
            <span *ngIf="sortKey.value === 'name'">
                {{ sortDirection.value === 'asc' ? '↥' : '↧' }}
              </span>
          </th>
          <td cdk-cell *cdkCellDef="let row" class=" pr-0">
<!--            <a class="btn-block"-->
<!--               [routerLink]="['/orcid/' + row['curator_orcid']]"-->
<!--            >-->
              {{row['name']}}
<!--            </a>-->
          </td>
        </ng-container>
        <ng-container cdkColumnDef="events">
          <th cdk-header-cell *cdkHeaderCellDef (click)="adjustSort('events')">
            Number of biocuration events
<!--            <span *ngIf="sortKey.value === 'entry_id'">-->
<!--                {{ sortDirection.value === 'asc' ? '↥' : '↧' }}-->
<!--              </span>-->
          </th>
          <td cdk-cell *cdkCellDef="let row" class=" pr-0">
<!--            <a class="btn-block"-->
<!--               [routerLink]="['/orcid/' + row['curator_orcid']]"-->
<!--            >-->
              {{row['reports'].length}}
<!--            </a>-->
          </td>
        </ng-container>

        <ng-container cdkColumnDef="by_category">
          <th cdk-header-cell *cdkHeaderCellDef>
            by terms
<!--            <span *ngIf="sortKey.value === 'entry_id'">-->
<!--                {{ sortDirection.value === 'asc' ? '↥' : '↧' }}-->
<!--              </span>-->
          </th>
          <td cdk-cell *cdkCellDef="let row" class=" pr-0">
<!--            <a class="btn-block"-->
<!--               [routerLink]="['/orcid/' + row['curator_orcid']]"-->
<!--            >-->
              <span [innerHTML]="calc_html_categories(row['count_by_category'])"></span>
<!--            </a>-->
          </td>
        </ng-container>

        <ng-container cdkColumnDef="by_term">
          <th cdk-header-cell *cdkHeaderCellDef>
            by terms
<!--            <span *ngIf="sortKey.value === 'entry_id'">-->
<!--                {{ sortDirection.value === 'asc' ? '↥' : '↧' }}-->
<!--              </span>-->
          </th>
          <td cdk-cell *cdkCellDef="let row" class=" pr-0">
<!--            <a class="btn-block"-->
<!--               [routerLink]="['/orcid/' + row['curator_orcid']]"-->
<!--            >-->
              <span [innerHTML]="calc_by_terms(row['reports'])"></span>
<!--            </a>-->
          </td>
        </ng-container>

        <ng-container cdkColumnDef="badges">
          <th cdk-header-cell *cdkHeaderCellDef>
Badges
            <!--            <span *ngIf="sortKey.value === 'entry_id'">-->
<!--                {{ sortDirection.value === 'asc' ? '↥' : '↧' }}-->
<!--              </span>-->
          </th>
          <td cdk-cell *cdkCellDef="let row" class=" pr-0">
<!--            <a class="btn-block"-->
<!--               [routerLink]="['/orcid/' + row['curator_orcid']]"-->
<!--            >-->
              <span [innerHTML]="calc_html_badges(row['badge'])"></span>
<!--            </a>-->
          </td>
        </ng-container>

      </table>
    </div>
  </div>


</div>
