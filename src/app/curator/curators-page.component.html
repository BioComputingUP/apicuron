<div class="tw-px-2 tw-mx-auto tw-max-w-7xl sm:tw-px-8 2xl:tw-px-0">
    <div class="tw-py-2 md:tw-pt-4 md:tw-pb-6 tw-flex tw-flex-row tw-flex-wrap tw-justify-between">
        <h2 class="tw-text-3xl tw-font-bold tw-font-dm-sans">Curators</h2>

    </div>
    <curator-search (urlStringEvent)="update_curator_list($event)"></curator-search>
    <div class="tw-flex tw-flex-row tw-flex-wrap tw-py-2 lg:tw-py-4 tw-my-2 lg:tw-my-6 tw-border-t tw-border-gray-700">
        <div *ngFor="let biocurator of biocurators" class="sm:tw-w-1/3 tw-w-1/2 tw-p-2">
            <curator-card [biocurator]="biocurator"></curator-card>
        </div>
    </div>
    <div class="tw-flex tw-justify-center tw-my-2">
        <pagination [totalItems]="total_items" [itemsPerPage]="page_size" [(ngModel)]="current_page" (pageChanged)="update_page($event.page)" [rotate]="true" [maxSize]="5"></pagination>
    </div>
</div>
