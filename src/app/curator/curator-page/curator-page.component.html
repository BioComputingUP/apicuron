<div class="tw-px-2 tw-mx-auto tw-max-w-7xl sm:tw-px-8 2xl:tw-px-0">
    <div class="tw-py-2 sm:tw-py-4">
        <ng-container *ngIf="curator$ | async as curator">
            <img [src]="generate_avatar(curator.displayedName)" class="tw-w-24 tw-h-24 tw-mx-auto tw-rounded-full tw-bg-gray-50 tw-border-2 tw-border-gray-150" alt="">
            <h2 class="tw-text-center tw-font-bold tw-font-dm-sans tw-text-2xl">{{ curator.displayedName }}
            </h2>
            <a [href]="'http://orcid.org/' + curator.orcid_id"
                class="tw-block tw-text-sm tw-text-center hover:tw-underline tw-text-blue-500 hover:tw-text-blue-600 tw-mr-1">{{
                curator.orcid_id }}<img class="tw-inline" src="assets/link.svg" alt="" srcset=""></a>
            <div class="tw-flex tw-justify-center" *ngIf="user_resources$ | async as user_resources">
                <a *ngFor="let resource of user_resources" [routerLink]="['/databases', resource.resource_id]"
                    class="tw-px-2 tw-mr-2 tw-py-1 hover:tw-underline hover:tw-text-white tw-text-sm tw-bg-apicuron-purple tw-text-white tw-font-bold tw-font-dm-sans tw-rounded-full">
                    {{ resource.resource_name }}
                </a>
            </div>
        </ng-container>
    </div>
    <ng-container>
        <div class="tw-grid tw-grid-cols-1 tw-gap-4 tw-mb-2">
            
            <div *ngIf="keywords$ | async as keywords" class="tw-w-full tw-flex tw-flex-row">
                <div class="tw-w-1/6 tw-font-bold tw-text-lg">Keywords</div>
                <div class="tw-w-5/6 tw-flex tw-flex-row tw-flex-wrap tw-gap-3 tw-items-center">
                    <span *ngFor="let keyword of keywords"
                        class="tw-px-2 tw-py-1 tw-whitespace-nowrap tw-cursor-default tw-text-sm tw-bg-apicuron-purple tw-text-white tw-font-bold tw-font-dm-sans tw-rounded-full">
                        {{ keyword }}
                    </span>
                </div>
            </div>
            <div *ngIf="orcid_links$ | async as orcid_links" class="tw-w-full tw-flex tw-flex-row">
                <div class="tw-w-1/6 tw-font-bold tw-text-lg">Social Links</div>
                <div class="tw-w-5/6">
                    <a *ngFor="let url of orcid_links"
                        class="tw-text-blue-500 hover:tw-text-blue-600 tw-cursor-pointer hover:tw-underline tw-mr-3"
                        [href]="url.value">
                        {{ url.name }}
                    </a>
                </div>
            </div>
            <div *ngIf="biography$ | async as biography" class="tw-w-full tw-flex tw-flex-row">
                <div class="tw-w-1/6 tw-font-bold tw-text-lg">Biography</div>
                <div class="tw-w-5/6">
                    <p class="tw-leading-relaxed tw-tracking-wider tw-text-justify tw-text-base">
                        {{ biography }}
                    </p>
                </div>
            </div>
        </div>
    </ng-container>

    <curator-stat [resource$]="resource$" [user_resources$]="user_resources$" [curator$]="curator$" [user_stats$]="user_stats$"></curator-stat>

</div>
