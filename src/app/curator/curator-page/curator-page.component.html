<div class="tw-px-2 tw-mx-auto tw-max-w-7xl sm:tw-px-8 2xl:tw-px-0">
    <div class="tw-py-2 sm:tw-py-4">
        <ng-container *ngIf="curator$ | async as curator">
            <svg-avatar [ngClass]="'tw-w-24 tw-h-24 tw-mx-auto tw-text-gray-800'"></svg-avatar>
            <h2 class="tw-text-center tw-font-bold tw-font-dm-sans tw-text-2xl">{{ curator.displayedName }}
            </h2>
            <a [href]="'http://orcid.org/' + curator.orcid_id"
                class="tw-block tw-text-sm tw-text-center hover:tw-underline tw-text-blue-500 hover:tw-text-blue-600 tw-mr-1">{{
                curator.orcid_id }}<img class="tw-inline" src="assets/link.svg" alt="" srcset=""></a>
            <div class="tw-flex tw-justify-center">
                <a *ngFor="let stat of curator.stats" [routerLink]="['/databases', stat.resource_id]"
                    class="tw-px-2 tw-mr-2 tw-py-1 hover:tw-underline hover:tw-text-white tw-text-sm tw-bg-apicuron-purple tw-text-white tw-font-bold tw-font-dm-sans tw-rounded-full">
                    {{ stat.resource_id }}
                </a>
            </div>
        </ng-container>
    </div>
    <ng-container *ngIf="orcidData$ | async as orcid_data">
        <div class="tw-grid tw-grid-cols-1 tw-gap-4 tw-mb-2">
            <div *ngIf="orcid_data.biography" class="tw-w-full tw-flex tw-flex-row">
                <div class="tw-w-1/6 tw-font-bold tw-text-lg">Biography</div>
                <div class="tw-w-5/6">
                    <p class="tw-leading-relaxed tw-tracking-wider tw-text-justify tw-text-base">
                        {{ orcid_data.biography }}
                    </p>
                </div>
            </div>
            <div *ngIf="orcid_data.keywords" class="tw-w-full tw-flex tw-flex-row">
                <div class="tw-w-1/6 tw-font-bold tw-text-lg">Keywords</div>
                <div class="tw-w-5/6">
                    <span *ngFor="let keyword of orcid_data.keywords"
                        class="tw-px-2 tw-mr-2 tw-py-1 hover:tw-underline hover:tw-text-white tw-text-sm tw-bg-apicuron-purple tw-text-white tw-font-bold tw-font-dm-sans tw-rounded-full">
                        {{ keyword }}
                    </span>
                </div>
            </div>
            <div *ngIf="orcid_data.social_urls" class="tw-w-full tw-flex tw-flex-row">
                <div class="tw-w-1/6 tw-font-bold tw-text-lg">Social Links</div>
                <div class="tw-w-5/6">
                    <a *ngFor="let url of orcid_data.social_urls"
                        class="tw-text-blue-500 hover:tw-text-blue-600 tw-cursor-pointer hover:tw-underline"
                        [href]="url[1]">
                        {{ url[0] }}
                    </a>
                </div>
            </div>
        </div>
    </ng-container>

    <curator-stat [resource_id$]="resourceId$" [curator$]="curator$"></curator-stat>

</div>
