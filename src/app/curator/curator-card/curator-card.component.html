        <svg-avatar [ngClass]="{'tw-w-24 tw-h-24': vertical, 'tw-w-20 tw-h-20': !vertical, 'tw-rounded-full tw-text-gray-800': true}"></svg-avatar>
    </div>
    <div class="tw-flex tw-flex-col" [ngClass]="{'tw-items-center': vertical, 'tw-ml-2': !vertical}">
        <a [routerLink]="['/curators', orcid_id]" class="tw-text-xl tw-font-dm-sans tw-text-gray-900 hover:tw-text-gray-900 tw-font-bold hover:tw-underline">{{ displayedName
            }}</a>
        <a [href]="'http://orcid.org/'+orcid_id" target="_blank"
            class="tw-text-blue-600 tw-font-light tw-text-sm hover:tw-underline hover:tw-text-blue-700 tw-cursor-pointer">
            {{ orcid_id }}
            <img class="tw-inline tw-h-3 tw-w-3" src="assets/link.svg" alt="">
        </a>
        <div *ngIf="single_resource()" class="tw-pt-1 tw-pb-2 tw-flex tw-flex-row tw-items-center tw-text-gray-400">
            <svg class="tw-h-4 tw-w-4" viewBox="0 0 13 17" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M0.0759903 0.656951C-0.108186 0.387653 0.0640529 0 0.360782 0H4.02044C4.24681 0.0028959 4.457 0.118565 4.58149 0.30875L5.75988 2.02403L3.38946 5.48889L0.0759903 0.656951ZM6.5 16.4667C2.24568 16.4667 0.11588 11.2934 3.12377 8.26798C6.13167 5.24256 11.2749 7.38477 11.2749 11.6639C11.2749 14.3164 9.13713 16.4667 6.5 16.4667ZM6.5 5.65184C7.39947 5.65079 8.28747 5.85488 9.09723 6.24876L12.924 0.656951C13.1082 0.387653 12.9359 0 12.6392 0H8.97956C8.75319 0.0028959 8.543 0.118565 8.41851 0.30875L4.53375 5.98632C5.16582 5.76449 5.83055 5.65141 6.5 5.65184Z"
                    fill="currentColor" />
            </svg>
            <span>{{ biocurator['stats']['medals_count'] }}</span>

            </svg>
            <span>{{ biocurator['stats']['badges_count'] }}</span>


        </div>
        <div *ngIf="display_resources" class="tw-pt-1 tw-pb-2" [ngClass]="{'tw-max-w-lg': vertical}">
            <span *ngIf="!vertical"
                class="tw-text-gray-400 tw-font-bold tw-uppercase tw-text-sm tw-mr-2">resources</span>
            <ng-container *ngIf="resources$ | async as converter">
                <a *ngFor="let resource of resources"
                [routerLink]="['/databases', resource ]"
                class="tw-bg-apicuron-purple tw-text-gray-100 tw-cursor-pointer hover:tw-text-white tw-font-bold tw-text-xs tw-rounded-2xl tw-p-1 tw-mr-1">{{
                converter[resource] }}</a>

            </ng-container>
            <!-- <a
                class="tw-bg-apicuron-purple tw-text-gray-100 tw-cursor-pointer hover:tw-text-white tw-font-bold tw-text-xs tw-rounded-2xl tw-p-1 tw-mr-1">Disprot</a> -->
        </div>
    </div>
    <div *ngIf="display_scores"
        class="tw-w-full tw-flex tw-flex-row tw-flex-wrap tw-border-t tw-justify-center tw-border-gray-500 tw-mt-2 md:tw-mt-auto">
        <div
            class="tw-w-1/2 sm:tw-w-1/3 tw-border-r sm:tw-border-b-0 tw-border-b tw-border-gray-500 tw-p-1 md:tw-p-1 tw-justify-se">
            <span class="tw-text-xs tw-uppercase tw-font-bold tw-text-gray-400">
                generation
            </span>
            <span class="tw-block tw-text-lg tw-font-bold tw-text-gray-800 tw-text-right">{{ generation_score }}</span>
        </div>
        <div
            class="tw-w-1/2 sm:tw-w-1/3 sm:tw-border-r sm:tw-border-b-0 tw-border-b tw-border-gray-500 tw-p-1 md:tw-p-1">
            <span class="tw-text-xs tw-uppercase tw-font-bold tw-text-gray-400">
                revision
            </span>
            <span class="tw-block tw-text-lg tw-font-bold tw-text-gray-800 tw-text-right">{{ revision_score }}</span>
        </div>
        <div class="tw-w-1/2 sm:tw-w-1/3 tw-p-1 md:tw-p-1 sm:tw-border-0">
            <span class="tw-text-xs tw-uppercase tw-font-bold tw-text-gray-400">
                invalidation
            </span>
            <span class="tw-block tw-text-lg tw-font-bold tw-text-gray-800 tw-text-right">{{ invalidation_score
                }}</span>
        </div>
    </div>

</div>
