<div class="tw-block tw-pr-4 tw-from-apicuron-purple tw-to-apicuron-red tw-bg-gradient-to-b tw-text-gray-300 tw-h-screen" *ngIf="resource$ | async as resource">
    <h2 class="tw-text-xl tw-font-bold tw-font-dm-sans tw-text-white tw-text-left tw-p-2 tw-whitespace-nowrap">{{
        resource.resource_name }} Dashboard</h2>
    <ul class="tw-ml-2" *ngIf="links$ | async as links">
        <li class="" *ngFor="let link of links">
            <a class="tw-whitespace-nowrap tw-p-2 hover:tw-text-white tw-border-l-2 tw-border-gray-300 tw-gray-300 tw-px-2 tw-ml-2" [routerLinkActive]="' tw-text-lg tw-border-white tw-font-bold tw-text-white'" [routerLink]="link.href">{{ link.name }}</a>
        </li>
    </ul>
</div>
