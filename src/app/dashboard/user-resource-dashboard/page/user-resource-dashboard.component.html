<div class="tw-p-1 lg:tw-p-2">
  <h2 class="tw-text-lg">My Contriburions for
    <span
      class="tw-font-bold"
      [ngStyle]="{ color: (resource$ | async).color }">
      {{ (resource$ | async).resource_name }}</span>
  </h2>

  <!-- Number Cards -->
  <div *ngIf="mainNumbers$ | async as numbers" class="tw-flex tw-flex-row tw-justify-stretch">
    <div *ngFor="let entry of numbers" class="tw-p-1">
      <number-card [value]="entry.value" [label]="entry.label"></number-card>
    </div>
  </div>

  <div class="tw-flex tw-flex-row tw-justify-start">
    <!-- Achievements -->
    <div class="tw-w-2/3 lg:tw-w-1/2">
      <div class="tw-p-1">
        <div class="tw-flex tw-flex-col tw-bg-white"
          *ngIf="activitiesAndResource$ | async as activitiesAndResource">
          <span class="tw-block tw-w-full tw-text-gray-700 tw-font-bold tw-text-lg tw-font-dm-sans tw-px-3 tw-pt-1">
            Badges in progress
          </span>
          <ng-container *ngIf="progressFilter$ | async as filter">
            <my-badges-details
              [terms]="activitiesAndResource[0]"
              [filter]="filter"
              [limit]="6"
              [resource]="activitiesAndResource[1]">
            </my-badges-details>
          </ng-container>

          <div class="tw-h-4"></div>

          <span class="tw-block tw-w-full tw-text-gray-700 tw-font-bold tw-text-lg tw-font-dm-sans tw-px-3 tw-pt-1">
            Recently Earned Badges
          </span>
          <ng-container *ngIf="achievedFilter$ | async as filter">
          <my-badges-details
            [terms]="activitiesAndResource[0]"
            [filter]="filter"
            [limit]="6"
            [resource]="activitiesAndResource[1]">
          </my-badges-details>
          </ng-container>
      
        </div>
      </div>
    </div>

    <!-- Pie Chart -->
    <div class="tw-w-1/3 lg:tw-w-1/2">
      <div class="tw-p-1">
        <div class="tw-w-full tw-bg-white" *ngIf="userActivities$ | async as userActivities">
          <h3 class="tw-block tw-w-full tw-text-gray-700 tw-font-bold tw-text-lg tw-font-dm-sans tw-px-3 tw-pt-1">Detailed Activity Statistics</h3>
          <doughnut-pie-chart [activities]="userActivities"></doughnut-pie-chart>
        </div>
      </div>
    </div>
  </div>
</div>
