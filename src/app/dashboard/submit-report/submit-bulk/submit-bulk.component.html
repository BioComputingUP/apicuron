<div class="tw-border-gray-500 tw-bg-white tw-shadow-lg tw-border tw-rounded tw-p-1 tw-flex tw-flex-col">
    <h2 class="tw-text-xl tw-font-bold tw-text-gray-800">Submit Reports Bulk</h2>
    <form [formGroup]="form" (ngSubmit)="submit()">

        <div class="form-control-element">
            <label for="reports" class="tw-flex tw-flex-row tw-justify-between tw-items-center">
                <span>Reports JSON file</span>
                <small class="tw-text-blue-500">See file specifications <a href="" class="tw-font-bold">here</a></small>
            </label>
            <!-- <input type="file" name="reports" id=""> -->
            <input type="file" (change)="onFileSelected($event)" accept="application/json"
                class="tw-block tw-w-full tw-text-sm tw-text-slate-500 file:tw-mr-4 file:tw-py-2 file:tw-px-4 file:tw-rounded file:tw-border-0 file:tw-text-sm file:tw-font-semibold file:tw-bg-white file:tw-shadow-lg file:tw-text-apicuron-purple">
        </div>

        <div class="form-control-element">
            <label for="delete-all">Delete all</label>
            <div>
                <input type="checkbox" name="delete-all" formControlName="delete-all" id="">
                <span> Delete all the previous Data</span>
            </div>
        </div>

        <div class="tw-flex tw-flex-row tw-justify-center">
            <input type="submit" value="Submit report" [disabled]="form.invalid"
                [ngClass]="{'tw-bg-gray-300 tw-text-gray-600':form.invalid, 'tw-bg-apicuron-purple tw-text-white tw-shadow-md': !form.invalid}"
                class=" tw-font-bold tw-p-2 focus:tw-ring-1 tw-ring-purple-900 tw-rounded" />
        </div>
    </form>
</div>
