<div
  class="tw-p-5 tw-flex tw-flex-col tw-h-full tw-bg-white tw-drop-shadow-sm tw-rounded-md tw-transition-all tw-duration-300 tw-ease-in-out hover:tw-border-violet-400">
  <!-- First row: Avatar -->
  <div class="tw-grid tw-grid-cols-1 tw-gap-2 tw-my-2">
    <img class="tw-aspect-square tw-mx-auto tw-border tw-rounded-full" style="width: 70px; height:auto;"
      [src]="entry.curator.generate_avatar()" alt="Curator Avatar" />
  </div>

  <!-- Second row: Curator information -->
  <div class="tw-grid tw-gap-2 tw-text-center">
    <div>
      <a class="tw-font-extrabold tw-text-xl tw-text-slate-800 hover:tw-text-slate-600 hover:tw-underline"
        [routerLink]="['/curators', entry.curator.orcid_id]">
        {{ entry.curator.displayedName }}
      </a>
    </div>
    <div>
      <p>{{ entry.curator.orcid_id }}<a [href]="entry.curator.orcid_url()" target="_blank"
          class="tw-cursor-pointer tw-align-top">
          <img class="tw-ml-2 tw-inline tw-h-6 tw-w-6" src="https://orcid.org/assets/vectors/orcid.logo.icon.svg" alt=""
            role="tooltip">
        </a></p>
      <p>{{ entry.curator.affiliation }}</p>
    </div>
  </div>

  <!-- Third row: Contributions and Resources -->
  <!-- <div class="tw-grid tw-grid-cols-2 tw-gap-2 tw-justify-items-center">
    <div *ngFor="let contribution of getContributions(); let i = index"
      class="tw-font-dm-sans tw-bg-[#edebf2] tw-rounded tw-px-2 tw-py-2 tw-w-full">
      <img [src]="contribution.resource.logo" class="tw-h-5 tw-cursor-pointer" (click)="toggleGroups(i)"
        alt="Resource Logo" />

      <ul [ngClass]="{
            'tw-max-h-0': !showGroups[i],
            'tw-max-h-screen': showGroups[i]
          }" class="tw-transition-all tw-duration-200 tw-ease-out tw-overflow-hidden tw-pl-4">
        <li *ngFor="let group of contribution.groups">
          {{ group.displayedName }}
        </li>
      </ul>

    </div>
  </div> -->
  <div class="tw-my-2 tw-transition-all tw-duration-1000 tw-ease-out">
    <div class="tw-flex tw-flex-wrap tw-gap-2 tw-justify-center">
      <div *ngFor="let contribution of getContributions(); let i = index"
        class="tw-font-dm-sans tw-bg-gray-100 tw-rounded-full tw-px-5 tw-py-2 tw-max-w-xs">
        <img src="https://disprot.org/assets/DisProt_prot_vect_brownonly.svg" class="tw-h-6 tw-cursor-pointer"
          (click)="toggleGroups(i)" alt="Resource Logo" />
      </div>
    </div>
  </div>


</div>
