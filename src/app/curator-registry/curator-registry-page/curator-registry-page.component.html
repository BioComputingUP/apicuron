<div class="tw-mx-[10%] tw-p-2 tw-border">
  <div *ngIf="entries$ | async as entries">
    <curator-search
      (urlStringEvent)="update_curator_list($event)"
    ></curator-search>

    <div class="tw-font-dm-sans tw-font-extrabold tw-my-4 tw-text-3xl tw-pl-2">
      Curators
    </div>
    <div class="tw-grid tw-grid-cols-3 tw-gap-4">
      <div *ngFor="let entry of entries">
        <app-registry-card [entry]="entry"></app-registry-card>
      </div>
    </div>
    <div class="tw-grid tw-w-full tw-justify-center tw-m-4">
      <pagination
        [totalItems]="biocurators_count$ | async"
        [itemsPerPage]="limit"
        (pageChanged)="update_page($event.page)"
        [maxSize]="5"
      ></pagination>
    </div>
  </div>
</div>
