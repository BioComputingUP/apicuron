<div class = "tw-mx-[10%] tw-p-2 tw-border">
  <div *ngIf="entries$ | async as entries">
	
    <div class="tw-font-dm-sans tw-font-extrabold tw-my-4 tw-text-3xl tw-pl-2">Curators</div>
    <div class="tw-grid tw-grid-cols-3 tw-gap-4">
      <div *ngFor="let entry of entries">
        <app-registry-card [entry]="entry"></app-registry-card>
      </div>
    </div>
  </div>
</div>
