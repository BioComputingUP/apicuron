<div class="tw-border-2 tw-border-gray-400 tw-bg-white tw-rounded-md tw-p-2 md:tw-p-4 focus:tw-shadow-2xl tw-h-full">
    <div class="tw-flex tw-flex-row tw-justify-between">
        <a target="_blank"
            class="tw-text-xl tw-font-bold hover:tw-underline tw-text-gray-800 tw-cursor-pointer"
            [href]="resource_url">{{ name }}</a>
        <a class="tw-text-lg tw-text-blue-500 hover:tw-text-blue-600 tw-cursor-pointer hover:tw-underline"
            [routerLink]="['/databases',resource_id]">View
            Details</a>

    </div>
    <span class="tw-text-gray-400 tw-font-semibold tw-text-left tw-font-dm-sans">{{ short_description}}</span>
    <p class="tw-font-medium tw-text-gray-800 tw-pt-2 md:tw-pt-4 tw-overflow-ellipsis">{{ description_formatted }}</p>
    <div class="tw-flex tw-flex-row tw-justify-end tw-pt-4">
        <img src="{{ logo_src }}" [alt]="'Logo of ' + name" class="tw-w-1/3">
    </div>
</div>
