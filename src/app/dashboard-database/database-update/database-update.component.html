<div class="tw-p-2 tw-flex-auto" *ngIf="resource$ | async as resource">

    <div class=" tw-p-2">
        <span class="tw-text-xl tw-font-bold">Update {{ resource.resource_name }}</span>

        <form class="tw-flex tw-flex-row tw-flex-wrap" (ngSubmit)="submit()" [formGroup]="form">

            <div class="form-control-element tw-w-full sm:tw-w-1/2">
                <label for="resource_name">Resource Name</label>
                <input type="text" formControlName="resource_name">
                <small class="tw-text-red-500 tw-text-sm tw-font-light"
                    *ngIf="resource_name.hasError('required') && resource_name.touched">
                    The Resource Name is required
                </small>

            </div>
            <div class="form-control-element tw-w-full sm:tw-w-1/2">
                <label for="resource_url">Resource URL</label>
                <input type="text" formControlName="resource_url">
                <small class="tw-text-red-500 tw-text-sm tw-font-light"
                    *ngIf="resource_url.hasError('required') && resource_url.touched">
                    The Resource URL is required
                </small>
            </div>
            <div class="form-control-element tw-w-full sm:tw-w-1/2">
                <label for="resource_long_name">Resource Long Name</label>
                <input type="text" formControlName="resource_long_name">
                <small class="tw-text-red-500 tw-text-sm tw-font-light"
                    *ngIf="resource_long_name.hasError('required') && resource_long_name.touched">
                    The Resource Long Name is required
                </small>
            </div>
            <div class="form-control-element tw-w-full sm:tw-w-1/2">

                <label>Upload Resource Logo</label>
                <input id="file_input" type="file" (change)="onFileSelected($event)">

            </div>
            <div class="form-control-element tw-w-full sm:tw-w-1/2">
                <label for="resource_description">Resource Description</label>
                <textarea class="text-input" name="resource_description" formControlName="resource_description"
                    id="resource_description_textarea" cols="30" rows="10"></textarea>
                <small class="tw-text-red-500 tw-text-sm tw-font-light"
                    *ngIf="resource_description.hasError('required') && resource_description.touched">
                    The Resource Description is required
                </small>
            </div>
            <div class="tw-w-full tw-flex tw-justify-center">
                <div class="tw-flex tw-justify-center">
                    <input type="submit" [value]="'Update ' + resource.resource_name" [disabled]="form.invalid"
                        [ngClass]="{'tw-bg-gray-300 tw-text-gray-600':form.invalid, 'tw-bg-apicuron-purple tw-text-white tw-shadow-md': !form.invalid}"
                        class=" tw-font-bold tw-p-2 focus:tw-ring-1 tw-ring-purple-900 tw-rounded" />
                </div>
            </div>
        </form>

    </div>

</div>
