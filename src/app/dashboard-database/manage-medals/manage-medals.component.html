<section
  class="tw-rounded tw-px-10 tw-pt-6"
  *ngIf="resource$ | async as resource"
>
  <div class="tw-flex tw-flex-row tw-items-center tw-justify-between tw-mb-4">
    <h3 class="tw-text-xl tw-font-bold">Manage Medals</h3>
    <button
      id="createMedal"
      style="background: #742573"
      class="tw-px-4 tw-py-2 tw-font-normal tw-text-white tw-rounded tw-text-sm tw-flex tw-items-center"
      (click)="open_create_form(resource.resource_id)"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        width="16"
        height="16"
        class="tw-mr-2"
      >
        <path fill="white" d="M19 13H11V19H9V13H3V11H9V5H11V11H19V13Z" />
      </svg>
      Create Medal
    </button>
  </div>

  <div class="tw-relative tw-w-full tw-mt-3 tw-mb-4 tw-flex">
    <span
      class="tw-absolute tw-inset-y-0 tw-left-3 tw-flex tw-items-center tw-pointer-events-none"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        width="24"
        height="24"
      >
        <circle
          cx="11"
          cy="11"
          r="8"
          stroke="gray"
          stroke-width="2"
          fill="none"
        />
        <line x1="16" y1="16" x2="21" y2="21" stroke="gray" stroke-width="2" />
      </svg>
    </span>
    <input
      id="search_input"
      type="text"
      placeholder="Search medals"
      class="!tw-pl-12 tw-p-2 tw-border tw-border-gray-300 tw-rounded-md tw-w-full"
      [ngModel]="searchInput | async"
      (ngModelChange)="searchInput.next($event)"
      (keydown.enter)="onSearchClick()"
    />
    <button
      class="tw-ml-2 tw-px-4 tw-bg-blue-600 tw-text-white tw-rounded-md"
      (click)="onSearchClick()"
    >
      Search
    </button>
  </div>

  <div
    class="tw-flex tw-flex-row tw-flex-wrap tw-py-1"
    *ngIf="medals$ | async as medals"
  >
    <ng-container *ngIf="terms$ | async as terms">
      <div
        *ngFor="let medal of medals.data"
        class="tw-p-2 tw-w-1/2 lg:tw-w-1/3 xl:tw-w-1/4"
      >
        <div
          class="tw-bg-white tw-relative tw-rounded-md tw-flex tw-flex-col tw-h-full tw-border"
        >
          <div class="tw-flex tw-items-center tw-justify-between tw-px-3">
            <div class="tw-flex-grow">
              <medal-def-card
                [medal]="medal"
                [terms]="terms"
                [enableShadow]="false"
              ></medal-def-card>
            </div>
          </div>

          <div
            class="tw-mt-auto tw-mx-6 tw-pb-3 tw-flex tw-justify-center tw-gap-2"
          >
            <button
              (click)="confirmDeleteMedal(medal)"
              class="tw-bg-gray-200 tw-p-2 tw-rounded tw-w-full tw-text-gray tw-gap-2 tw-flex tw-items-center tw-justify-center"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="16"
                height="16"
              >
                <path
                  fill="gray"
                  d="M6 19C6 20.1 6.9 21 8 21H16C17.1 21 18 20.1 18 19V7H6V19ZM16 3H14V2C14 1.4 13.6 1 13 1H11C10.4 1 10 1.4 10 2V3H8C7.4 3 7 3.4 7 4C7 4.6 7.4 5 8 5H16C16.6 5 17 4.6 17 4C17 3.4 16.6 3 16 3Z"
                />
              </svg>
              <span class="tw-text-sm"> Delete </span>
            </button>
            <button
              (click)="open_edit_form(medal)"
              class="tw-bg-green-500 tw-p-2 tw-rounded tw-w-full tw-text-white tw-gap-2 tw-flex tw-items-center tw-justify-center"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="16"
                height="16"
              >
                <path
                  fill="white"
                  d="M3 17.25V20H5.75L15.51 10.24L13.76 8.49L3 17.25ZM20.71 7.04C21.1 6.65 21.1 6.02 20.71 5.63L18.37 3.29C18.02 2.94 17.38 2.94 17.03 3.29L15.76 4.56L19.44 8.24L20.71 7.04Z"
                />
              </svg>
              <span class="tw-text-sm"> Edit </span>
            </button>
          </div>
        </div>
      </div>
    </ng-container>
  </div>

  <div
    class="tw-w-full tw-flex tw-flex-row tw-justify-center tw-py-2 tw-mb-10 sm:tw-py-4"
    *ngIf="medals$ | async as medals"
  >
    <pagination
      [totalItems]="medals.meta.pagination.total"
      [itemsPerPage]="limit"
      [page]="page$ | async"
      (pageChanged)="page$.next($event.page)"
      [maxSize]="5"
    ></pagination>
  </div>
</section>

<ng-container *ngIf="manageForm$ | async as manageForm">
  <div
    *ngIf="manageForm.show"
    class="tw-relative tw-z-50 tw-overflow-y-scroll"
    aria-labelledby="modal-title"
    role="dialog"
    aria-modal="true"
  >
    <div
      class="tw-fixed tw-inset-0 tw-bg-gray-500 tw-bg-opacity-75 tw-backdrop-blur-sm tw-transition-opacity tw-duration-200"
      [ngClass]="{ 'tw-block': manageForm.show, 'tw-hidden': !manageForm.show }"
      (click)="manageForm.show = false"
    ></div>

    <div class="tw-fixed tw-inset-0 tw-z-10 tw-overflow-y-auto">
      <div
        class="tw-flex tw-min-h-full tw-items-center tw-justify-center tw-p-4 tw-text-center sm:tw-items-center sm:tw-p-0"
      >
        <div
          [ngClass]="{
            'tw-block': manageForm.show,
            'tw-hidden': !manageForm.show
          }"
          class="tw-relative tw-transform tw-rounded-lg tw-bg-white tw-text-left tw-shadow-xl tw-transition-all tw-w-3/4 sm:tw-my-8 sm:tw-w-full sm:tw-max-w-lg sm:tw-h-1/2"
        >
          <medal-form
            [medal]="manageForm.medal"
            [type]="manageForm.type"
            [terms]="terms$ | async"
            (formResult)="formSubmit($event)"
            (closeForm)="onCloseForm()"
          ></medal-form>
        </div>
      </div>
    </div>
  </div>
</ng-container>
