<section class="tw-bg-white tw-rounded tw-p-2" *ngIf="resource$ | async as resource">
    <h3 class="tw-text-xl tw-font-bold">Manage Medals</h3>

    <div class="tw-flex tw-flex-row tw-justify-end">
        <button class="tw-bg-apicuron-purple tw-text-white tw-rounded tw-font-bold tw-shadow-md tw-p-1"
            (click)="open_create_form(resource.resource_id)">Create
            Medal</button>
    </div>

    <div class="tw-flex tw-flex-row tw-flex-wrap tw-py-1" *ngIf="medals$ | async as medals">
        <ng-container *ngIf="terms$ | async as terms">
            <div *ngFor="let medal of medals.data" class="tw-p-1 tw-w-1/2 sm:tw-w-1/3 lg:tw-w-1/4">
                <div class="tw-bg-white tw-relative tw-rounded-lg tw-shadow-md tw-shadow-gray-500 tw-pt-1 tw-h-full">
                    <div>
                        <medal-def-card [medal]="medal" [terms]="terms" [enableShadow]="false"></medal-def-card>
                    </div>
                    <div class="tw-flex tw-flex-row tw-justify-between">
                        <div class="tw-w-1/2">
                            <button (click)="open_edit_form(medal)"
                                class="tw-bg-green-500 tw-text-white tw-font-bold tw-w-full tw-rounded-bl tw-shadow-md">Edit</button>
                        </div>
                        <div class="tw-w-1/2">
                            <button (click)="delete_medal(medal)"
                                class="tw-bg-red-500 tw-text-white tw-font-bold tw-w-full tw-rounded-br tw-shadow-md">Delete</button>
                        </div>
                    </div>
                </div>
            </div>

        </ng-container>

    </div>

    <!-- TODO: Make sure the Pagination remains in the bottom -->
    <div class="tw-w-full tw-flex tw-flex-row tw-justify-center tw-pt-2 sm:tw-pt-4" *ngIf="medals$ | async as medals">
        <pagination [totalItems]="medals.meta.pagination.total" [itemsPerPage]="limit" [page]="(page$ | async)"
            (pageChanged)="page$.next($event.page)" [maxSize]="5"></pagination>
    </div>
</section>


<ng-container *ngIf="manageForm$ | async as manageForm">
    <div *ngIf="manageForm.show" class="tw-relative tw-z-50 tw-overflow-y-scroll" aria-labelledby="modal-title"
        role="dialog" aria-modal="true">

        <div class="tw-fixed tw-inset-0 tw-bg-gray-500 tw-bg-opacity-75 tw-backdrop-blur-sm tw-transition-opacity tw-duration-200"
            [ngClass]="{'tw-block':manageForm.show, 'tw-hidden': !manageForm.show}" (click)="manageForm.show = false">
        </div>

        <div class="tw-fixed tw-inset-0 tw-z-10 tw-overflow-y-auto">
            <div
                class="tw-flex tw-min-h-full tw-items-center tw-justify-center tw-p-4 tw-text-center sm:tw-items-center sm:tw-p-0">

                <div [ngClass]="{'tw-block':manageForm.show, 'tw-hidden': !manageForm.show}"
                    class="tw-relative tw-transform tw-rounded-lg tw-bg-white tw-text-left tw-shadow-xl tw-transition-all tw-w-3/4 sm:tw-my-8 sm:tw-w-full sm:tw-max-w-lg sm:tw-h-1/2 ">
                    <medal-form [medal]="manageForm.medal" [type]="manageForm.type" [terms]="(terms$ | async)"
                        (formResult)="formSubmit($event)"></medal-form>
                    <button class="tw-w-full tw-mx-auto tw-p-2 tw-bg-gray-400 tw-text-white tw-capitalize"
                        (click)="manageForm.show = false">Close</button>
                </div>
            </div>
        </div>
    </div>
</ng-container>
