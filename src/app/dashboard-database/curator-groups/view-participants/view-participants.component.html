<div class="tw-bg-white tw-grid tw-grid-flow-row tw-grid-cols-1 tw-gap-2 tw-px-4 tw-pt-5 tw-pb-4 sm:tw-p-6 sm:tw-pb-4 tw-max-w-2xl tw-w-96 tw-max-h-screen tw-overflow-y-auto tw-justify-self-center">
	<form>
	  <h2 class="tw-text-xl tw-text-center tw-font-bold">
		 {{ group.displayedName }} members
	  </h2>
  
	  <div *ngIf="curators$ | async as curators">
		<ul class="tw-bg-white tw-border tw-border-gray-100 tw-w-full tw-my-2">
			<li *ngFor="let member of curators" class="tw-px-2 tw-py-1 tw-border-b-2 tw-flex tw-flex-row tw-border-gray-100 tw-relative tw-cursor-pointer hover:tw-bg-gray-200 aria-selected:tw-bg-apicuron-purple aria-selected:tw-text-gray-100 tw-pl-2">
				<span class="tw-flex tw-flex-col">
					<span class="tw-flex tw-flex-row tw-items-center">
						<a [href]="'http://orcid.org/' + member.orcid_id" target="_blank" class="tw-block tw-w-6 tw-h-6 tw-mr-1">
							<img src="https://orcid.org/assets/vectors/orcid.logo.icon.svg" class="tw-w-6 tw-h-6" alt="Orcid Logo"/>
						</a>
						<span class="tw-flex-wrap tw-text-sm tw-pl-1">
							<b>{{ member.displayedName }}</b> - {{ member.orcid_id }}
						</span>
					</span>
				</span>
			</li>
		</ul>
	</div>
  
	</form>

  
	<button 
	  class="tw-bg-gray-400 tw-text-gray-100 tw-w-full tw-block tw-py-1 lg:tw-py-2" 
	  (click)="closeForm()">
	    Close
	</button>
  </div>
