<!-- Main page with the information about curation groups -->
<div class="tw-p-2 tw-flex-auto">
  <div class="tw-flex tw-flex-col tw-mx-2">
    <div>
      <h3 class="tw-text-2xl tw-px-2 tw-font-bold">Manage Curation Groups</h3>
    </div>

    <div class="tw-w-full tw-justify-between tw-px-1 tw-pt-2">
      <div class="tw-flex tw-flex-row tw-pb-1">
        <div class="tw-flex tw-flex-row">
          <div class="tw-flex tw-flex-row tw-flex-wrap">
            <div class="tw-text-center tw-flex tw-flex-col tw-p-1" *ngFor="let grp of (groups$ | async)?.data">
              <resource-group-card
                [group]="grp"
                class="tw-rounded"
                (groupEvent)="groupClickEventHandler($event)">
              </resource-group-card>
            </div>
            <!-- Create new Curation group icon -->
            <div class="tw-block tw-p-2 tw-cursor-pointer"
              (click)="createGroupClickHandler($event)">
              <div class="tw-flex tw-flex-col tw-border-2 tw-border-dashed tw-border-apicuron-purple-100 tw-rounded-lg tw-w-56 tw-max-h-full tw-h-full tw-justify-center tw-items-center tw-cursor-pointer">
                <svg-icon
                  class="tw-block tw-h-16 tw-w-16 tw-cursor-pointer"
                  svgClass="tw-text-apicuron-purple"
                  src="assets/svg/create_icon.svg">
                </svg-icon>
                <span class="tw-text-apicuron-purple tw-text-center tw-text-sm tw-cursor-pointer tw-p-2">Create a new Curation Group</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
