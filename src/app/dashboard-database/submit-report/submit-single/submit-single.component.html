<div class="tw-border-gray-300 tw-bg-white tw-border tw-rounded tw-p-4 tw-flex tw-flex-col">
    <h2 class="tw-text-lg tw-font-bold tw-text-gray-800">Submit Report</h2>
    <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-control-element">
            <label for="activity_term">Activity Term</label>
            <select *ngIf="terms$ | async as terms" formControlName="activity_term" name="activity_term"
                class="tw-py-2 tw-px-4 tw-w-full tw-border tw-border-gray-300 tw-rounded-md">
                <option *ngFor="let term of terms" [value]="term.activity_term">{{ term.activity_name }}</option>
            </select>
        </div>

        <div class="form-control-element">
            <label for="activity_term">Curator Orcid</label>
            <input type="text" name="curator_orcid" formControlName="curator_orcid" id="">
            <small class="tw-text-red-500 tw-text-sm tw-font-light"
                *ngIf="curator_orcid.hasError('required') && curator_orcid.touched">
                The Orcid Id is required
            </small>
            <small class="tw-text-red-500 tw-text-sm tw-font-light" *ngIf="curator_orcid.hasError('pattern')">
                The Orcid Id doesn't match the pattern of an orcid Identifier
            </small>
            <small class="tw-text-red-500 tw-text-sm tw-font-light"
                *ngIf="curator_orcid.hasError('checksum') && curator_orcid.touched && !curator_orcid.hasError('pattern')">
                Invalid Orcid Id, checksum failed
            </small>

        </div>
        <div class="form-control-element">
            <label for="activity_term">Entity URI</label>
            <input type="text" name="entity_uri" formControlName="entity_uri" id="">
            <small class="tw-text-red-500 tw-text-sm tw-font-light"
                *ngIf="entity_uri.hasError('required') && entity_uri.touched">
                The Entity URI is required
            </small>
            <small class="tw-text-red-500 tw-text-sm tw-font-light" *ngIf="entity_uri.hasError('pattern')">
                The Entity URI has to be a link
            </small>
        </div>
        <div class="form-control-element">
            <label for="activity_term">Time and Date</label>
            <div class="tw-flex tw-flex-row tw-gap-2">
                <input type="date" formControlName="date" name="" id="" class="tw-w-full">
                <input type="time" formControlName="time" id="" class="tw-w-full">
            </div>
            <small class="tw-text-red-500 tw-text-sm tw-font-light" *ngIf="form.hasError('future-date')">
                The date cannot be a future date
            </small>
        </div>
        <div class="tw-flex tw-flex-row tw-justify-center">
            <input type="submit" value="Submit report" [disabled]="form.invalid"
                [ngClass]="{'tw-bg-gray-300 tw-text-gray-600':form.invalid, 'tw-bg-apicuron-purple tw-text-white tw-shadow-md': !form.invalid}"
                class=" tw-font-bold tw-p-2 focus:tw-ring-1 tw-ring-purple-900 tw-rounded" />
        </div>
    </form>
</div>
