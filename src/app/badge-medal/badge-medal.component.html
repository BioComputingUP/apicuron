<div class="badge badge-pill badge-medal  mr-2 mb-2" [style]="{'background-color': color + '20', 'height': '3rem'}">
  <div class="row">
    <div class="col-3">
      <svg
        *ngIf="badge['type'] === 'medal'"
        xmlns="http://www.w3.org/2000/svg"
        width="1.8em" height="1.8em" viewBox="0 0 100 100"
        [style]="{fill:badge['color_code'], 'font-size': 'large'}"
        data-name="Layer 1"
        x="0px"
        y="0px"
        version="1.1"
        id="svg62"
      >

        <path
          d="M 12.33,5.83 C 11.25,4.26 12.26,2 14,2 h 21.46 c 1.327413,0.016883 2.559971,0.6912308 3.29,1.8 l 6.91,10 L 31.76,34 Z M 50,98 C 25.052929,98 12.563911,67.84012 30.202016,50.202016 47.84012,32.563911 78,45.052929 78,70 78,85.463973 65.463973,98 50,98 Z m 0,-63.05 c 5.274448,-0.0061 10.481637,1.183724 15.23,3.48 L 87.67,5.83 C 88.75,4.26 87.74,2 86,2 H 64.54 c -1.327413,0.016883 -2.559971,0.6912308 -3.29,1.8 L 38.47,36.9 C 42.176453,35.606719 46.074397,34.947483 50,34.95 Z"
          id="path60"
        />
      </svg>
      <svg           *ngIf="badge['type'] === 'badge'"
                     width="1.8em" height="1.8em" viewBox="0 0 16 16" class="bi bi-award-fill" [style]="{fill:badge['color_code'], 'font-size': 'large'}"
                     xmlns="http://www.w3.org/2000/svg">
        <path
          d="M8 0l1.669.864 1.858.282.842 1.68 1.337 1.32L13.4 6l.306 1.854-1.337 1.32-.842 1.68-1.858.282L8 12l-1.669-.864-1.858-.282-.842-1.68-1.337-1.32L2.6 6l-.306-1.854 1.337-1.32.842-1.68L6.331.864 8 0z"/>
        <path d="M4 11.794V16l4-1 4 1v-4.206l-2.018.306L8 13.126 6.018 12.1 4 11.794z"/>
      </svg>
    </div>
    <div class="col-9" style="white-space: normal; width: 7rem; text-align: left;vertical-align: middle" [style]="{'color': color + ' !important'}">
      {{badge['name']}}
    </div>
  </div>
</div>
