<form [formGroup]="newUserRegForm">

  <div class="row" style="margin-top: 10px">
    <div class="col-12">
      <!--<h6>Registration of the new user</h6>-->
      <div class="input-group mb-3 col-12">
        <div class="input-group-prepend">
          <span class="input-group-text" style="width: 150px">Username</span>
        </div>
        <input type="text" class="form-control" formControlName="username">
      </div>
      <div class="input-group mb-3 col-12">
        <div class="input-group-prepend">
          <span class="input-group-text" style="width: 150px">Full name</span>
        </div>
        <input type="text" class="form-control" formControlName="displayedName">
      </div>
      <div class="input-group mb-3 col-12">
        <div class="input-group-prepend">
          <span class="input-group-text" style="width: 150px">role</span>
        </div>
        <input type="text" class="form-control" formControlName="role">
      </div>
      <div class="input-group mb-3 col-12">
        <div class="input-group-prepend">
          <span class="input-group-text" style="width: 150px">Institution</span>
        </div>
        <input type="text" class="form-control" formControlName="institution">
      </div>



      <div class="input-group mb-3 col-12">
        <div class="input-group-prepend">
          <span class="input-group-text" style="width: 150px">E-Mail address</span>
        </div>
        <input type="email" class="form-control" formControlName="email">
      </div>
      <div class="input-group mb-3 col-12">
        <div class="input-group-prepend">
          <span class="input-group-text" style="width: 150px">Gmail</span>
        </div>
        <input type="email" class="form-control" formControlName="gmail">
      </div>
      <div formArrayName="resources">
        <div *ngFor="let address of newUserRegForm['controls']['resources']['controls']; let i=index">
          <div [formGroupName]="i" >
            <hr>
            <div class="input-group mb-3 col-12">
              <div class="input-group-prepend">
                <span class="input-group-text" style="width: 150px">Resource name</span>
              </div>
              <input type="text" class="form-control" formControlName="name">
            </div>
            <div class="input-group mb-3 col-12">
              <div class="input-group-prepend">
                <span class="input-group-text" style="width: 150px">Resource ID</span>
              </div>
              <input type="text" class="form-control" formControlName="id">
            </div>
            <div class="col-12">
              <button class="btn btn-outline-success ml-2" (click)="addFormArrayElement()">Add more</button>
              <button class="btn btn-outline-danger ml-2" (click)="removeFormArrayElement(i)">Remove this
              </button>
            </div>


          </div>
        </div>
      </div>
      <hr>

      <div class="input-group mb-3 col-4">
        <button
          (click)="regNewUser()"
          class="btn btn-outline-primary"
          style="width: 150px"
          [disabled]="!newUserRegForm.valid"
        >{{buttomName}}</button>
      </div>
      <div class="input-group mb-3 col-4">

        <button type="button"
                class="btn btn-outline-danger mb-0"
                (click)="deleteUser()"
        >
          delete profile
        </button>
      </div>

    </div>
  </div>
</form>
