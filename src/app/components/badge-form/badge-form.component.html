<form [formGroup]="form" (submit)="submit()"
  class="tw-py-4 tw-w-full tw-grid tw-grid-cols-1 sm:tw-grid-cols-2 tw-gap-4">
  <!-- Header -->
  <div class="tw-border-b-4 tw-flex tw-items-center tw-pb-4 tw-w-full tw-col-span-2">
    <h2 *ngIf="type == 'create'" class="tw-px-6 tw-text-xl tw-font-bold tw-flex tw-items-center">
      Create Badge
      <span *ngIf="this.form.get('displayedName').value"
        class="tw-p-1 tw-ml-2 tw-px-3 tw-text-sm tw-rounded-sm tw-bg-apicuron-purple-100 tw-text-font-bold tw-text-apicuron-purple tw-max-w-[120px] sm:tw-max-w-[300px] tw-truncate">
        {{ this.form.get('displayedName').value }}
      </span>
    </h2>
    <h2 *ngIf="type == 'update'" class="tw-px-6 tw-text-xl tw-font-bold tw-flex tw-items-center">
      Updating Badge
      <span *ngIf="this.form.get('displayedName').value"
        class="tw-p-1 tw-ml-2 tw-px-3 tw-text-sm tw-rounded-sm tw-bg-apicuron-purple-100 tw-text-font-bold tw-text-apicuron-purple tw-max-w-[120px] sm:tw-max-w-[300px] tw-truncate">
        {{ this.form.get('displayedName').value }}
      </span>
    </h2>
  </div>

  <!-- Badge Name and Identifier in One Row -->
  <div class="tw-px-6 tw-col-span-2 sm:tw-grid sm:tw-grid-cols-2 sm:tw-gap-4">
    <div>
      <label class="tw-block tw-font-bold tw-text-gray-700">Badge Name<span style="color: red;">*</span></label>
      <input type="text" formControlName="displayedName"
        class="tw-w-full tw-p-2 !tw-px-4 tw-border tw-border-gray-300 tw-rounded-md" />
    </div>
    <div>
      <label class="tw-block tw-font-bold tw-text-gray-700">Badge Identifier<span style="color: red;">*</span></label>
      <input type="text" formControlName="name"
        class="tw-w-full tw-p-2 !tw-px-4 tw-border tw-border-gray-300 tw-rounded-md" [readonly]="type == 'update'" />
      <small class="tw-pt-2 tw-leading-tight tw-block tw-text-xs tw-text-gray-500">This value is used as an identifier
        in the API, not displayed
        publicly</small>
    </div>
  </div>

  <!-- List of Terms -->
  <div class="tw-px-6 tw-mt-2 tw-col-span-2">
    <label class="tw-block tw-font-bold tw-text-gray-700">List of Terms<span style="color: red;">*</span></label>
    <p-multiSelect [options]="terms" [group]="true" formControlName="list_terms" defaultLabel="Select an activity Term"
      display="chip" class="tw-w-full"
      styleClass="tw-w-full tw-border tw-border-gray-300 tw-rounded-md"></p-multiSelect>
  </div>

  <!-- Color Code and Number of Contributions in One Row -->
  <div class="tw-px-6 tw-mt-2 tw-w-full tw-col-span-2 ">
    <!-- Color Code -->
    <!-- <div class="tw-mt-2 sm:tw-mt-0">
      <label class="tw-block tw-font-bold tw-text-gray-700">Color Code</label>
      <div class="tw-flex tw-items-start tw-gap-2">
        <div>
          <input type="text" placeholder="Gold" formControlName="color_code"
            class="tw-capitalize tw-w-full !tw-px-4 tw-p-2 tw-border tw-border-gray-300 tw-rounded-md" />
          <small class="tw-pt-2 tw-leading-tight tw-block tw-text-xs tw-text-gray-500">
            This field determines the badge color.
          </small>
        </div>
        <div class="tw-h-10 tw-w-10 tw-rounded-md"
          [ngStyle]="{ 'background-color': form.get('color_code').value || 'gold' }"></div>
      </div>
      <small class="tw-pt-2 tw-block tw-leading-tight tw-text-sm tw-text-red-500"
        *ngIf="form.get('color_code').hasError('pattern') && form.get('color_code').touched">
        Color Code should be either a hex code (e.g., #333), "bronze", "silver" or "gold"
      </small>
    </div> -->
    <!-- <div> -->
    <label class="tw-block tw-font-bold tw-text-gray-700">Number of Contributions<span
        style="color: red;">*</span></label>
    <input type="number" min="1" formControlName="count_threshold"
      class="tw-w-full tw-p-2 !tw-px-4 tw-border tw-border-gray-300 tw-rounded-md" />
    <!-- </div> -->
  </div>

  <!-- Start and End Date in One Row -->
  <div class="tw-px-6 tw-mt-2 sm:tw-mt-0 tw-col-span-2 sm:tw-grid sm:tw-grid-cols-2 sm:tw-gap-4">

    <div class="tw-mt-2 sm:tw-mt-0">
      <label class="tw-block tw-font-bold tw-text-gray-700">Start Date</label>
      <p-calendar formControlName="startDate" [showIcon]="true" [maxDate]="form.get('endDate').value" [showClear]="true"
        [readonlyInput]="true"
        styleClass="tw-w-full tw-p-2 !tw-px-4  tw-border tw-border-gray-300 tw-rounded-md"></p-calendar>
    </div>
    <div class="tw-mt-2 sm:tw-mt-0">
      <label class="tw-block tw-font-bold tw-text-gray-700">End Date</label>
      <p-calendar formControlName="endDate" [showIcon]="true" [minDate]="form.get('startDate').value" [showClear]="true"
        [readonlyInput]="true"
        styleClass="tw-w-full tw-p-2 !tw-px-4 tw-border tw-border-gray-300 tw-rounded-md"></p-calendar>
    </div>

  </div>

  <!-- Submit Button -->
  <div class="tw-px-6 tw-mt-2 tw-col-span-2 tw-flex tw-items-center tw-gap-2">
    <button type="button" (click)="onClose()"
      class="tw-w-24 tw-p-2 tw-border tw-border-gray-400 tw-text-gray-400 tw-font-bold tw-rounded-md">Close</button>
    <input type="submit"
      class="tw-flex-1 tw-rounded-md tw-bg-apicuron-bright-purple tw-px-3.5 tw-pt-2.5 tw-pb-3.5 tw-text-center tw-text-sm tw-font-semibold tw-text-white tw-shadow-sm tw-hover:bg-indigo-500"
      value="Submit" />
  </div>
</form>
