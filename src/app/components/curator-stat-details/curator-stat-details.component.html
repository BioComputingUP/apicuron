<div
    class="tw-flex tw-h-full tw-flex-col tw-overflow-y-hidden tw-bg-gray-100 tw-py-6 tw-shadow-xl sm:tw-pt-4 tw-px-2 sm:tw-px-6">
    <div>
        <h2 class="tw-text-base tw-font-semibold tw-leading-6 tw-text-gray-900" id="slide-over-title">
            {{ curator.displayedName }}'s Contributions to
            <span [ngStyle]="{ color: resource.color }">{{
                resource.resource_name
                }}</span>
        </h2>
    </div>
    <div class="tw-relative tw-mt-6">
        <form [formGroup]="form" class="tw-shadow-md tw-flex tw-flex-row sm:tw-p-1 tw-bg-white tw-rounded">
            <div class="tw-w-1/6 tw-flex tw-flex-col tw-items-start tw-pr-2">
                <span class="tw-text-sm tw-font-bold tw-tracking-wide tw-text-gray-700">From</span>
                <input type="date" name="" id="" class="tw-w-full tw-h-6 tw-grow focus:tw-outline-none"
                    formControlName="from">
            </div>
            <div class="tw-w-1/6 tw-flex tw-flex-col tw-items-start tw-pr-2">
                <span class="tw-text-sm tw-font-bold tw-tracking-wide tw-text-gray-700">To</span>
                <input type="date" name="" id="" class="tw-w-full tw-h-6 tw-grow focus:tw-outline-none"
                    formControlName="to">
            </div>
            <div class="tw-w-1/3 tw-flex tw-flex-col tw-items-start tw-pr-2">
                <span class="tw-text-sm tw-font-bold tw-tracking-wide tw-text-gray-700">Filter By Activity</span>
                <select-multiple class="tw-w-full" [completeSet]="itemizedTerms" formControlName="activity_terms"
                    hintText="Select Activities to filter By"></select-multiple>
            </div>
            <div class="tw-w-1/6 tw-flex tw-flex-col tw-items-start">
                <span class="tw-text-sm tw-font-bold tw-tracking-wide tw-text-gray-700">Sort By</span>
                <select name="" id="" class="tw-bg-white tw-p-1 tw-text-gray-700 tw-grow focus:tw-outline-none"
                    formControlName="sortBy">
                    <option class="tw-text-sm tw-tracking-wide tw-text-gray-700 tw-whitespace-break-spaces tw-bg-white"
                        *ngFor="let field of sortFields" [value]="field.value" [selected]="field.value == 'timestamp'">
                        {{ field.text }}</option>
                </select>
            </div>
            <div class="tw-w-1/6 tw-flex tw-flex-col tw-items-start">
                <span class="tw-text-sm tw-font-bold tw-tracking-wide tw-text-gray-700">Sort Order</span>
                <select name="" id="" class="tw-bg-white tw-p-1 tw-text-gray-700 tw-grow focus:tw-outline-none"
                    formControlName="sortOrder">
                    <option class="tw-text-sm tw-tracking-wide tw-text-gray-700 tw-whitespace-break-spaces"
                        value="desc">
                        Decending</option>
                    <option class="tw-text-sm tw-tracking-wide tw-text-gray-700 tw-whitespace-break-spaces" value="asc">
                        Ascending</option>

                </select>

            </div>
        </form>
    </div>

    <div></div>

    <div class="tw-relative tw-w-full tw-flex tw-flex-row tw-flex-wrap sm:tw-pt-4"
        *ngIf="reportsWithTerms$ | async as filteredReports">

        <div class="tw-w-full tw-flex tw-flex-row tw-justify-end tw-gap-1 tw-py-1">
            <button class="tw-rounded-full  tw-p-1"
                [ngClass]="{'tw-bg-gray-700 tw-text-gray-300': viewType == 'grid', 'tw-bg-gray-300 tw-text-gray-700': viewType == 'table'  }"
                (click)="viewType = 'grid'">
                <svg-icon src="assets/svg/grid.svg" svgClass="tw-w-4 tw-h-4"></svg-icon>
            </button>
            <button class="tw-rounded-full tw-p-1"
                [ngClass]="{'tw-bg-gray-700 tw-text-gray-300': viewType == 'table', 'tw-bg-gray-300 tw-text-gray-700': viewType == 'grid' }"
                (click)="viewType = 'table'">
                <svg-icon src="assets/svg/table.svg" svgClass="tw-w-4 tw-h-4"></svg-icon>
            </button>
        </div>

        <div class="tw-overflow-x-auto tw-w-full" *ngIf="viewType == 'table'">
            <report-table [reports]="filteredReports">
            </report-table>

        <ng-container *ngIf="viewType == 'grid'">
            <div class="tw-w-1/2 sm:tw-w-1/4 tw-p-1" *ngFor="let entry of filteredReports.data">
