<div *ngIf="resource$ | async as resource">
    <div class="tw-flex tw-flex-row tw-max-w-fit tw-bg-white tw-rounded-t-md">
        <button (click)="showTotalLeaderboard()" 
        class="tw-w-full sm:tw-w-auto tw-py-1 tw-m-1 tw-bg-white tw-text-gray-700 focus:tw-bg-apicuron-bright-purple tw-font-semibold tw-text-sm focus:tw-text-gray-100 sm:tw-rounded-tl-md tw-px-2">
            Total Leaderboard
        </button>
        <button (click)="showWeeklyLeaderboard()" 
        class="tw-w-full sm:tw-w-auto tw-py-1 tw-m-1 tw-bg-white tw-text-gray-700 focus:tw-bg-apicuron-bright-purple tw-font-semibold tw-text-sm focus:tw-text-gray-100 sm:tw-rounded-tr-md tw-px-2">
            Weekly Leaderboard
        </button>
    </div>

    <!-- Total Leaderboard -->
    <div *ngIf="showTotal" class="tw-bg-white tw-rounded-r-md tw-shadow-lg tw-p-1 md:tw-p-2 tw-text-gray-700" style="font-family: system-ui;">
        <h4 class="tw-text-xl tw-font-dm-sans tw-font-semibold tw-my-2">{{ resource.resource_name }}'s Total Leaderboard</h4>
        <total-leaderboard></total-leaderboard>
    </div>

    <!-- Weekly Leaderboard -->
    <div *ngIf="!showTotal" class="tw-bg-white tw-rounded-r-md tw-shadow-lg tw-p-1 md:tw-p-2 tw-text-gray-700" style="font-family: system-ui;">
        <h4 class="tw-text-xl tw-font-dm-sans tw-font-semibold tw-my-2">{{ resource.resource_name }}'s Weekly Leaderboard</h4>
        <weekly-leaderboard></weekly-leaderboard>
    </div>
</div>

<!-- Terms and awards section -->
<div class="tw-bg-white tw-rounded-b-md tw-shadow-md tw-p-1 md:tw-p-2 tw-text-gray-700" style="font-family: system-ui;">
    <ng-container *ngIf="statsWithUsers$ | async as statsWithUsers; else loading">
        <ng-container *ngIf="statsWithUsers.length > 0; else emptyList">
            <div class="tw-flex tw-flex-row tw-justify-between tw-pt-2 md:tw-pt-4">
                <div *ngIf="statsMeta$ | async as statsMeta">
                    <span>Total Contributors:
                        <span class="tw-bg-apicuron-bright-purple tw-text-white tw-font-bold tw-rounded-md tw-px-1">{{ statsMeta.pagination.total }}</span>
                    </span>
                </div>
                <div *ngIf="maxPage$ | async as maxPage">
                    <div class="tw-inline-flex tw-justify-center tw-gap-1" *ngIf="page$ | async as page">
                        <button (click)="prevPage()" [disabled]="page == 1"
                            class="tw-inline-flex tw-h-8 disabled:tw-text-gray-400 tw-w-8 tw-items-center tw-justify-center tw-rounded tw-border tw-border-gray-100 tw-bg-white tw-text-gray-900 rtl:tw-rotate-180">
                            <span class="tw-sr-only">Prev Page</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="tw-h-3 tw-w-3 tw-text-inherit"
                                viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
                                    clip-rule="evenodd"></path>
                            </svg>
                        </button>

                        <div>
                            <label for="PaginationPage" class="tw-sr-only">Page</label>

                            <div type="number"
                                class="tw-text-gray-700 tw-px-2 tw-py-1 tw-rounded tw-border tw-border-gray-300">
                                {{ page }}
                            </div>
                        </div>

                        <button (click)="nextPage()" [disabled]="page >= maxPage"
                            class="tw-inline-flex tw-h-8 disabled:tw-text-gray-400 tw-w-8 tw-items-center tw-justify-center tw-rounded tw-border tw-border-gray-100 tw-bg-white tw-text-gray-900 rtl:tw-rotate-180">
                            <span class="tw-sr-only">Next Page</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="tw-h-3 tw-w-3" viewBox="0 0 20 20"
                                fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                                    clip-rule="evenodd"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <a [href]="apicuronURL">
                    <img class="tw-w-48 tw-transition-transform hover:tw-scale-110 " src="assets/APICURON.svg" alt="">
                </a>
            </div>
        </ng-container>

        <ng-template #emptyList>
            <div class="tw-text-center">{{ resource.name }} Has no available Leaderboard yet</div>
        </ng-template>
    </ng-container>

    <ng-template #loading>
        <span class="tw-block tw-text-center tw-font-bold tw-py-2">
            <svg-icon src="assets/svg/loading-spinner.svg" svgClass="tw-animate-spin tw-h-10 tw-w-10 tw-mx-auto"></svg-icon>
        </span>
    </ng-template>
</div>
