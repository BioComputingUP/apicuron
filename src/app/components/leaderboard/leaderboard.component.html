<div *ngIf="resource$ | async as resource">
  <div class="tw-flex tw-flex-row tw-max-w-fit tw-bg-white tw-rounded-t-md">
    <button
      (click)="selectLeaderboard('total')"
      [ngClass]="{
        'selected-item': (isLeaderboard('total') | async),
        'unselected-item': !(isLeaderboard('total') | async)
      }"
      class="tw-w-full sm:tw-w-auto tw-py-1 tw-m-1 tw-bg-white tw-text-gray-700 tw-font-semibold tw-text-sm sm:tw-rounded-tl-md tw-px-2"
    >
      Total Leaderboard
    </button>
    <button
      (click)="selectLeaderboard('weekly')"
      [ngClass]="{
        'selected-item': (isLeaderboard('weekly') | async),
        'unselected-item': !(isLeaderboard('weekly') | async)
      }"
      class="tw-w-full sm:tw-w-auto tw-py-1 tw-m-1 tw-bg-white tw-text-gray-700 tw-font-semibold tw-text-sm sm:tw-rounded-tr-md tw-px-2"
    >
      Weekly Leaderboard
    </button>
  </div>

  <!-- Total Leaderboard -->
  <div
    *ngIf="isLeaderboard('total') | async"
    class="tw-bg-white tw-rounded-b-md tw-rounded-tr-md tw-shadow-lg tw-p-1 md:tw-p-2 tw-text-gray-700"
    style="font-family: system-ui"
  >
    <total-leaderboard [resource]="resource"></total-leaderboard>
  </div>

  <!-- Weekly Leaderboard -->
  <div
    *ngIf="isLeaderboard('weekly') | async"
    class="tw-bg-white tw-rounded-b-md tw-rounded-tr-md tw-shadow-lg tw-p-1 md:tw-p-2 tw-text-gray-700"
    style="font-family: system-ui"
  >
    <weekly-leaderboard [resource]="resource"></weekly-leaderboard>
  </div>
</div>
