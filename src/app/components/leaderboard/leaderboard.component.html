<div class="tw-bg-white tw-rounded-md tw-shadow-lg tw-p-1 md:tw-p-2 tw-text-gray-700" style="font-family: system-ui;"
    *ngIf="resource$ | async as resource">
    <div class="tw-flex tw-flex-col tw-overflow-x-auto" *ngIf="statsWithUsers$ | async as statsWithUsers">

        <table class="tw-table-auto">
            <thead>
                <tr class="tw-divide-x tw-divide-gray-200">
                    <th>Ranking</th>
                    <th colspan="2">Curator</th>
                    <th *ngFor="let column of tableColumns">
                        <span>

                            {{ getColumnProps(column).name }}
                            <ng-container *ngIf="column == 'medals_count'">
                                <svg-icon src="assets/medal_icon.svg"
                                    svgClass="tw-inline tw-w-4 tw-h-4 tw-text-gray-700"></svg-icon>
                            </ng-container>

                            <ng-container *ngIf="column == 'badges_count'">
                                <svg-icon src="assets/badge_icon.svg"
                                    svgClass="tw-inline tw-w-4 tw-h-4 tw-text-gray-700"></svg-icon>
                            </ng-container>

                        </span>
                    </th>

                </tr>
            </thead>
            <tbody class="tw-divide-y tw-divide-gray-200">
                <tr *ngFor="let entry of statsWithUsers;let indexOfelement=index;" class="odd:tw-bg-gray-50">
                    <td class="tw-text-center tw-font-bold">{{indexOfelement + 1}}</td>
                    <td>
                        <div class="tw-overflow-hidden tw-w-12 tw-h-12 tw-rounded-full tw-border-2 tw-border-apicuron-bright-purple"
                            [ngStyle]="{ borderColor: resource.color}">
                            <img [src]="entry.user.generate_avatar()" class="tw-w-full" alt="">
                        </div>
                    </td>

                    <td>

                        <div class="tw-flex tw-flex-row tw-ml-1 md:tw-ml-2 tw-items-center">
                            <a class="tw-text-lg tw-block hover:tw-underline tw-whitespace-pre"
                                [routerLink]="['/curators',entry.user.orcid_id]">
                                <span>{{ entry.user.displayedName }}</span>

                            </a>

                            <a [href]="entry.user.orcid_url()"
                                class="tw-block tw-w-6 tw-h-6 tw-ml-1 md:tw-ml-2">
                                <img src="https://orcid.org/assets/vectors/orcid.logo.icon.svg" class="tw-w-6 tw-h-6"
                                    alt="">
                            </a>
                        </div>


                    </td>
                    <td class="tw-text-center tw-font-bold tw-text-gray-700" *ngFor="let column of tableColumns">
                        {{ entry.stat[column] }}
                    </td>
                </tr>
            </tbody>
        </table>



    </div>
    <div class="tw-flex tw-flex-row tw-justify-between tw-pt-2 md:tw-pt-4">
        <div *ngIf="statsMeta$ | async as statsMeta">
            <span>
                Total Contributors: <span
                    class="tw-bg-apicuron-bright-purple tw-text-white tw-font-bold tw-rounded-md tw-px-1">{{
                    statsMeta.pagination.total }}</span>
            </span>
        </div>
        <!-- pagination -->
        <div *ngIf="maxPage$ | async as maxPage">
            <div class="tw-inline-flex tw-justify-center tw-gap-1" *ngIf="page$ | async as page">
                <button (click)="prevPage()" [disabled]="page == 1"
                    class="tw-inline-flex tw-h-8 disabled:tw-text-gray-400 tw-w-8 tw-items-center tw-justify-center tw-rounded tw-border tw-border-gray-100 tw-bg-white tw-text-gray-900 rtl:tw-rotate-180">
                    <span class="tw-sr-only">Prev Page</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="tw-h-3 tw-w-3 tw-text-inherit" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
                            clip-rule="evenodd"></path>
                    </svg>
                </button>

                <div>
                    <label for="PaginationPage" class="tw-sr-only">Page</label>

                    <div type="number" class="tw-text-gray-700 tw-px-2 tw-py-1 tw-rounded tw-border tw-border-gray-300">
                        {{ page }}
                    </div>
                </div>

                <button (click)="nextPage()" [disabled]="page >= maxPage"
                    class="tw-inline-flex tw-h-8 disabled:tw-text-gray-400 tw-w-8 tw-items-center tw-justify-center tw-rounded tw-border tw-border-gray-100 tw-bg-white tw-text-gray-900 rtl:tw-rotate-180">
                    <span class="tw-sr-only">Next Page</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="tw-h-3 tw-w-3" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                            clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
        </div>
        <a href="https://apicuron.org">
            <img class="tw-w-48 tw-transition-transform hover:tw-scale-110 "
                src="https://apicuron.org/assets/APICURON.svg" alt="">
        </a>
    </div>
</div>
