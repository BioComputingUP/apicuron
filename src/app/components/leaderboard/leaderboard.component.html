<div *ngIf="resource$ | async as resource">
    <div class="tw-flex tw-flex-row tw-max-w-fit tw-bg-white tw-rounded-t-md">
        <button (click)="showTotalLeaderboard()" 
            class="tw-w-full sm:tw-w-auto tw-py-1 tw-m-1 tw-bg-white tw-text-gray-700 focus:tw-bg-apicuron-bright-purple tw-font-semibold tw-text-sm focus:tw-text-gray-100 sm:tw-rounded-tl-md tw-px-2">Total Leaderboard</button>
        <button (click)="showWeeklyLeaderboard()" 
            class="tw-w-full sm:tw-w-auto tw-py-1 tw-m-1 tw-bg-white tw-text-gray-700 focus:tw-bg-apicuron-bright-purple tw-font-semibold tw-text-sm focus:tw-text-gray-100 sm:tw-rounded-tr-md tw-px-2">Weekly Leaderboard</button>
    </div>

    <!-- Total Leaderboard -->
    <div *ngIf="isTotal$ | async" class="tw-bg-white tw-rounded-b-md tw-rounded-tr-md tw-shadow-lg tw-p-1 md:tw-p-2 tw-text-gray-700" style="font-family: system-ui;">
        <h4 class="tw-text-xl tw-font-dm-sans tw-font-semibold tw-my-2">{{ resource.resource_name }}'s Total Leaderboard</h4>
        <total-leaderboard [resource]="resource"></total-leaderboard>
    </div>

    <!-- Weekly Leaderboard -->
    <div *ngIf="isWeekly$ | async" class="tw-bg-white tw-rounded-b-md tw-rounded-tr-md tw-shadow-lg tw-p-1 md:tw-p-2 tw-text-gray-700" style="font-family: system-ui;">
        <h4 class="tw-text-xl tw-font-dm-sans tw-font-semibold tw-my-2">{{ resource.resource_name }}'s Weekly Leaderboard</h4>
        <weekly-leaderboard [resource]="resource"></weekly-leaderboard>
    </div>
</div>
