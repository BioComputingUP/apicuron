<div
  class="tw-flex tw-flex-col tw-bg-white tw-rounded-md tw-px-1 sm:tw-p-2 tw-text-gray-800 tw-h-full"
  [ngClass]="{ 'tw-shadow-md tw-shadow-gray-400': enableShadow }"
>
  <div
    class="tw-flex tw-flex-row tw-justify-between"
    *ngIf="badge$ | async as badge"
  >
    <!-- <img src="assets/svg/badge_check.svg" class="tw-w-16" alt=""> -->
    <svg-icon src="assets/svg/badge_check.svg" svgClass="tw-w-16"></svg-icon>
    <div class="tw-flex tw-grow tw-flex-col tw-pl-2">
      <span
        class="tw-block tw-text-sm sm:tw-text-base tw-font-dm-sans tw-font-bold"
        >{{ badge.name }}</span
      >

      <span
        *ngIf="badge.state == AchievementState.achieved"
        class="tw-block tw-text-sm tw-w-full"
      >
        Earned by completing more than
        <span class="tw-italic tw-font-bold">{{ badge.count_threshold }} </span>
        <span
          class="tw-font-bold tw-underline tw-cursor-pointer"
          [popper]="activitiesList"
          [popperShowOnStart]="false"
          [popperTrigger]="'hover'"
          [popperHideOnScroll]="true"
          [popperPlacement]="'right'"
          >{{ badge.count_threshold > 1 ? "Activities" : "Activity" }}</span
        >
      </span>

      <span *ngIf="badge.state == AchievementState.progress" class="tw-text-sm tw-text-gray-700">

        In Progress, {{ badge.progressRate }}% completed
        <div>
            <span id="ProgressLabel" class="tw-sr-only">Badge Progress</span>
          
            <span
              role="progressbar"
              aria-labelledby="ProgressLabel"
              aria-valuenow="75"
              class="tw-relative tw-block tw-rounded-full tw-bg-gray-200"
            >
              <span class="tw-absolute tw-inset-0 tw-flex tw-items-center tw-justify-center tw-text-[10px]/4">
                <span class="tw-font-bold tw-text-gray-100 tw-mix-blend-difference"> {{ badge.progressRate | number:'2.0-1'}}% </span>
              </span>
          
              <span class="tw-block tw-h-4 tw-rounded-full tw-bg-indigo-600 tw-text-center" [style]="{width: badge.progressRate + '%'}"> </span>
            </span>
          </div>
      </span>
    </div>
    <!-- <span class="tw-text-sm tw-underline tw-text-blue-500 tw-block tw-self-end">more info</span> -->
  </div>
</div>

<popper-content #activitiesList>
  <div
    class="tw-flex tw-flex-col tw-items-stretch tw-bg-white tw-py-2 tw-rounded tw-shadow-md tw-shadow-gray-400"
  >
    <span
      class="tw-block tw-text-sm tw-font-dm-sans tw-text-gray-600 tw-leading-normal tw-py-1 tw-px-2 tw-text-center"
      *ngFor="let term of termNames$ | async"
      >{{ term }}</span
    >
  </div>
</popper-content>
