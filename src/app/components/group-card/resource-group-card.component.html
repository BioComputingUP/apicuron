<div class="tw-max-w-sm tw-w-full lg:tw-max-w-full lg:tw-flex lg:tw-flex-col tw-bg-white tw-rounded-lg tw-border tw-border-gray-400">
  <div class="tw-mt-4 tw-h-24 tw-flex-none tw-bg-cover tw-overflow-hidden tw-self-center lg:tw-min-w-[6rem]"
    style="background-image: url('assets/apicuron-people-round.jpg');
    background-size: 6rem;
    background-position: center;
    background-repeat: no-repeat"
    title="People in the background signifying a community">
  </div>
  <div class="tw-py-4 tw-pr-4 tw-pl-4 tw-min-w-[12rem] tw-flex tw-flex-col tw-justify-between tw-leading-normal">
    <div class="tw-p-0">
      <div class="tw-text-gray-900 tw-font-bold tw-text-xl tw-mb-2 tw-text-center">
        {{ group.displayedName }}
      </div>

      <ul>
        <li class="tw-text-sm tw-text-gray-600 tw-m-1">
          <span *ngIf="group.defaultMembers.length == 1" class="tw-text-gray-600">
            {{ group.defaultMembers.length }} member
          </span>
          <span *ngIf="group.defaultMembers.length != 1" class="tw-text-gray-600">
            {{ group.defaultMembers.length }} members
          </span>
        </li>
        <li class="tw-text-sm tw-text-gray-600 tw-m-1">
          <span *ngIf="group.visibility == 'public'"
            class="tw-inline-flex tw-items-center tw-rounded-md tw-px-1 tw-py-1 tw-text-sm tw-font-bold tw-text-apicuron-purple">
            {{ group.visibility }}
          </span>
          <span *ngIf="group.visibility == 'private'"
            class="tw-inline-flex tw-items-center tw-rounded-md tw-px-1 tw-py-1 tw-text-sm tw-font-bold tw-text-apicuron-red">
            {{ group.visibility }}
          </span>
        </li>
      </ul>
    </div>
    <div class="tw-pt-2 tw-items-center">
      <span class="tw-flex tw--space-x-px tw-overflow-hidden tw-rounded-md tw-border tw-bg-white tw-shadow-sm tw-max-w-fit">
        <button 
          (click)="handleEvent('edit', $event)"
          class="tw-inline-block tw-px-4 tw-py-2 tw-text-sm tw-font-medium tw-text-gray-700 hover:tw-bg-apicuron-bright-purple hover:tw-text-white focus:tw-relative">
          Edit
        </button>

        <button
          (click)="handleEvent('select', $event)"
          class="tw-inline-block tw-px-4 tw-py-2 tw-text-sm tw-font-medium tw-text-gray-700 hover:tw-bg-apicuron-bright-purple hover:tw-text-white focus:tw-relative">
          View
        </button>

        <button
          (click)="handleEvent('delete', $event)"
          class="tw-inline-block tw-px-4 tw-py-2 tw-text-sm tw-font-medium tw-text-gray-700 hover:tw-bg-red-500 hover:tw-text-white focus:tw-relative">
          Delete
        </button>
      </span>
    </div>
  </div>
</div>
