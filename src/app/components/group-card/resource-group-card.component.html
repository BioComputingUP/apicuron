<div class="tw-max-w-sm tw-w-full lg:tw-max-w-full lg:tw-flex">
  <div
    class="tw-h-32 lg:tw-h-auto lg:tw-w-32 tw-flex-none tw-bg-cover tw-overflow-hidden tw-rounded-l-lg tw-border-l tw-border-b tw-border-gray-400 tw-border-t tw-border-r-0"
    style="background-image: url('assets/apicuron-people.jpg')"
    title="People in the background signifying a community"
  ></div>
  <div
    class="tw-border-r tw-border-b tw-border-gray-400 tw-rounded-r-lg tw-border-l-0 tw-border-t tw-bg-white tw-py-4 tw-pr-4 tw-pl-2 tw-min-w-[20rem] tw-flex tw-flex-col tw-justify-between tw-leading-normal"
  >
    <div>
      <div
        class="tw-text-gray-900 tw-font-bold tw-text-xl tw-mb-2 tw-text-left"
      >
        {{ group.displayedName }}
      </div>

      <ul>
        <li class="tw-text-sm tw-text-gray-600 tw-flex tw-items-center">
          Privacy:
          <span
            class="tw-ml-1 tw-inline-flex tw-items-center tw-rounded-md tw-bg-apicuron-purple-100 tw-px-1 tw-py-1 tw-text-xs tw-text-apicuron-purple tw-font-bold tw-ring-1 tw-ring-inset tw-ring-apicuron-purple"
            >{{ group.visibility }}</span
          >
        </li>
        <li class="tw-text-sm tw-text-gray-600 tw-flex tw-items-center">
          Member Count:
          <span class="tw-font-bold tw-text-gray-600 tw-ml-1">{{
            group.defaultMembers.length
          }}</span>
        </li>
      </ul>
    </div>
    <div class="tw-pt-3">
      <span
        class="tw-flex tw--space-x-px tw-overflow-hidden tw-rounded-md tw-border tw-bg-white tw-shadow-sm tw-max-w-fit"
      >
        <button
          (click)="handleEvent('edit', $event)"
          class="tw-inline-block tw-px-4 tw-py-2 tw-text-sm tw-font-medium tw-text-gray-700 hover:tw-bg-gray-50 focus:tw-relative"
        >
          Edit
        </button>

        <button
          (click)="handleEvent('select', $event)"
          class="tw-inline-block tw-px-4 tw-py-2 tw-text-sm tw-font-medium tw-text-gray-700 hover:tw-bg-gray-50 focus:tw-relative"
        >
          View
        </button>

        <button
          (click)="handleEvent('delete', $event)"
          class="tw-inline-block tw-px-4 tw-py-2 tw-text-sm tw-font-medium tw-text-gray-700 hover:tw-bg-gray-50 focus:tw-relative"
        >
          Delete
        </button>
      </span>
    </div>
  </div>
</div>
