<div
  *ngIf="bipScores$ | async as bipScores"
  class="tw-bg-white tw-pb-2 tw-rounded-md tw-shadow-md tw-mb-4"
>
  <div class="tw-col-span-2 lg:tw-col-span-4" *ngIf="user$ | async as user">
    <a [href]="user.bip_url" target="_blank" rel="noopener noreferrer">
      <div
        class="tw-flex tw-flex-row tw-items-center tw-gap-4 tw-mb-2 tw-bg-slate-200 tw-px-4 tw-py-4"
      >
        <img
          src="assets/logos/bip-scholar.png"
          alt="Bip! Scholar"
          class="tw-w-10"
        />
        <h1 class="tw-text-[1.3rem] tw-font-semibold">
          Bip! Scholar Statistics
        </h1>
      </div>
    </a>
  </div>
  <div
    class="tw-grid tw-grid-cols-2 tw-gap-4 tw-px-4 tw-mt-6 lg:tw-grid-cols-4"
  >
    <div *ngFor="let sectionItem of bipScores | keyvalue">
      <bip-scholar-card
        [stats_section_info]="sectionItem.value"
      ></bip-scholar-card>
    </div>
  </div>
</div>
