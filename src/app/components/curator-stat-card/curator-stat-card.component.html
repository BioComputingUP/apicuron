<div
  class="tw-h-full tw-w-full tw-bg-white tw-m-auto tw-p-1 sm:tw-p-2 tw-flex tw-flex-col tw-rounded-b-lg tw-shadow-lg tw-border-t-2 sm:tw-border-t-4"
  [ngStyle]="{ 'border-color': resource.color }">
  <!-- top Title bar -->
  <div class="tw-flex tw-flex-row tw-w-full tw-flex-wrap sm:tw-flex-nowrap tw-items-center tw-justify-between">
    <div class="tw-flex tw-flex-row tw-items-center">
      <span class="tw-font-bold tw-text-lg sm:tw-text-xl tw-font-dm-sans sm:tw-pr-2" [ngStyle]="{ color: resource.color }">{{
        resource.resource_name }}</span>
      <span class="tw-block tw-text-gray-500 tw-font-bold tw-font-dm-sans tw-text-xs sm:tw-text-sm tw-ml-1 sm:tw-ml-0 tw-align-middle">{{
        resource.resource_long_name
        }}</span>

    </div>

    <div class="sm:tw-grow tw-flex tw-flex-row tw-flex-wrap tw-justify-center sm:tw-justify-normal tw-w-full sm:tw-w-3/4">
      <div *ngFor="let reward of rewards" class="tw-px-1 tw-py-2 tw-w-1/5">
        <reward-card [icon_src]="reward.icon_src" [value_text]="reward.value_text" [label_text]="reward.label_text"
          [color]="resource.color"></reward-card>
      </div>
    </div>
    <!-- <button class="tw-ml-auto tw-text-sm hover:tw-underline tw-font-thin tw-text-blue-500 hover:tw-text-blue-600"
      (click)="open_details = true">
      View Details
    </button> -->
  </div>
  <div class="tw-flex tw-flex-row tw-flex-wrap tw-justify-start">
    <div class="tw-w-full"><span class="tw-font-bold tw-text-gray-500 tw-font-dm-sans tw-capitalize">{{ curator.displayedName }}'s Earned Medals</span></div>
    <div *ngFor="let medal of (medals$ | async)" class="tw-w-1/2 sm:tw-w-1/4 tw-p-1">
      <medal-card [medal]="medal"></medal-card>
    </div>
  </div>
  <div class="tw-flex tw-flex-row tw-flex-wrap">
    <!-- Badges list -->
    <div
      class="tw-w-full sm:tw-w-1/2 tw-flex tw-flex-row tw-content-start tw-flex-wrap">
      <div class="tw-w-full">
        <span class="tw-text-sm tw-font-bold tw-text-gray-500">{{ curator.displayedName }}'s Earned Badges</span>
      </div>
      <ng-container *ngIf="badges$ | async as badges">
        <div class="tw-w-1/2 tw-p-2" *ngFor="let badge of badges">
          <badge-card [badge]="badge"></badge-card>
        </div>
      </ng-container>
      
    </div>
    <!-- Latest Contributions List -->
    <div
      class="tw-w-full sm:tw-w-1/2 tw-flex tw-flex-row tw-content-start tw-flex-wrap">
      <div class="tw-w-full">
        <span class="tw-text-sm tw-font-bold tw-text-gray-500 tw-font-dm-sans tw-capitalize">{{ curator.displayedName }}'s Latest Contributions</span>
      </div>
      <ng-container *ngIf="reportsWithTerms$ | async as reports">
        <div class="tw-w-1/2 sm:tw-w-1/3 tw-p-2" *ngFor="let report of reports">
          <report-card [term]="report.term" [report]="report.report"></report-card>
        </div>
      </ng-container>
    </div>

    
  </div>
</div>

<slide-over-panel [(openPanel)]="open_details">
  <curator-stat-details [curator]="curator" [resource]="resource" [terms]="terms$ | async"></curator-stat-details>
</slide-over-panel>
