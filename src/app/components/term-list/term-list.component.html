<div class="tw-flex tw-flex-row tw-flex-wrap">
    <div [ngClass]="(termsContainerClass$ | async)" class="tw-p-2" *ngFor="let term of (initialTerms$ | async)">
        <term-card [term]="term"></term-card>
    </div>


</div>

<div #collapse_container [ngStyle]="{ 'max-height': this.collapsed ? 0 : '200vh'}"
    class="tw-flex tw-overflow-hidden tw-flex-row tw-flex-wrap tw-transition-all tw-duration-500 tw-ease-in-out"
    >
    <div [ngClass]="(termsContainerClass$ | async)" class="tw-p-2" *ngFor="let term of (remainingTerms$ | async)">
        <term-card [term]="term"></term-card>
    </div>

</div>
