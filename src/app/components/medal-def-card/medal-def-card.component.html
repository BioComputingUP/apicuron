<div class="tw-rounded-md  tw-bg-white tw-font-dm-sans tw-p-2 tw-h-full
tw-transition-all tw-duration-200 tw-ease-in
hover:tw-shadow-yellow-800 hover:tw-scale-105 " [ngClass]="{'tw-shadow-md tw-shadow-gray-400': enableShadow}">
    <div class="tw-flex tw-flex-row">
        <div class="tw-shrink-0">
            <img src="assets/svg/gold_medal.svg" class="tw-w-16 sm:tw-w-20 lg:tw-w-24" alt="Gold Medal">
        </div>
        <div class=" tw-pl-1 tw-text-gray-500 tw-text-sm tw-leading-relaxed tw-font-bold">
            <span class="tw-text-sm sm:tw-text-base tw-text-gray-800 tw-font-bold tw-block tw-text-left">{{ medal.name
                }}</span>

            <span *ngIf="medal.score_relative > 1">
                Requires ranking Among {{ medal.score_relative }} biocurators
            </span>
            <span *ngIf="medal.score_relative == 1">
                Requires ranking
                <span class="tw-not-sr-only">1st</span>
                <span class="tw-sr-only">First</span>
            </span>

            <span class="tw-font-bold tw-underline tw-cursor-pointer" (mouseenter)="openTooltip($event.target)"
                (mouseleave)="closeTooltip()">
                Contributions
            </span>
        </div>
    </div>
</div>


<ng-template #activitiesList>
    <div class="custom-tooltip tw-flex tw-flex-col tw-items-stretch tw-bg-white tw-py-2 tw-rounded tw-shadow-md
        tw-shadow-gray-400">
        <span
            class="tw-block tw-text-sm tw-font-dm-sans tw-text-gray-600 tw-leading-normal tw-py-1 tw-px-2 tw-text-center"
            *ngFor="let term of (termNames$ | async)">
            {{ term }}
        </span>
    </div>
</ng-template>
