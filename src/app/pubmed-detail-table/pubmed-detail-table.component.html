
<div class="col-12" >
  <div class="input-group mb-3" >
    <div class="input-group-prepend">
      <span class="input-group-text text-center" style="min-width: 180px" id="basic-addon1" >Search in DisProt</span>
    </div>
    <!--<input type="text" class="form-control" formControlName="search_term" placeholder="e.g.: p53">-->
    <input type="text" class="form-control"  [formControl]="searchFormControl" placeholder="e.g.: P04637">
    <div class="input-group-append" >
      <button class="btn btn-outline-primary-input" (click)="exampleSearch()"> example </button>
    </div>
  </div>
</div>

<div class="col-12">
  <div class="col-12">
    <!--<div class="col-12"> {{dataOnPage_old | json}}</div>-->
    <table cdk-table [dataSource]="dataOnPage" class="table">

      <tr cdk-header-row *cdkHeaderRowDef="displayedColumns.value"></tr>
      <tr cdk-row *cdkRowDef="let row; columns: displayedColumns.value"></tr>

      <ng-container cdkColumnDef="pmid">
        <th cdk-header-cell *cdkHeaderCellDef (click)="adjustSort('pmid')"> PubMed ID
          <span *ngIf="sortKey.value === 'pmid'">
                {{ sortDirection.value === 'asc' ? '↥' : '↧' }}
              </span>
        </th>
        <td cdk-cell *cdkCellDef="let row" > {{row.pmid}}</td>
      </ng-container>

      <ng-container cdkColumnDef="title">
        <th cdk-header-cell *cdkHeaderCellDef (click)="adjustSort('title')"> Title
          <span *ngIf="sortKey.value === 'title'">
                {{ sortDirection.value === 'asc' ? '↥' : '↧' }}
              </span>
        </th>
        <td cdk-cell *cdkCellDef="let row"></td>
      </ng-container>
      <ng-container cdkColumnDef="term_number">
        <th cdk-header-cell *cdkHeaderCellDef (click)="adjustSort('term_number')">  Number of terms
          <span *ngIf="sortKey.value === 'term_number'">
                {{ sortDirection.value === 'asc' ? '↥' : '↧' }}
              </span>
        </th>
        <td cdk-cell *cdkCellDef="let row" > {{row.term_number}}</td>
      </ng-container>
      <ng-container cdkColumnDef="resources">
        <th cdk-header-cell *cdkHeaderCellDef > Resources
        </th>
        <td cdk-cell *cdkCellDef="let row" >
          <span *ngFor="let curr of row.resources; let i = index">
            {{curr}}<span *ngIf="i !=row.resources.length-1">, </span>
          </span>
        </td>
      </ng-container>
      <ng-container cdkColumnDef="acc">
        <th cdk-header-cell *cdkHeaderCellDef > Protein accession (UniProt)
        </th>
        <td cdk-cell *cdkCellDef="let row" >
          {{row.acc.join(', ')}}
          <!--<span  *ngFor="let curr of row.acc; let i = index">-->
            <!--{{curr}}<span *ngIf="i !=row.acc.length-1">, </span>-->
          <!--</span>-->
        </td>
      </ng-container>

    </table>
    <pagination
      [totalItems]="tableDataSource.value.length"
      [itemsPerPage]="pageSize.value"
      [maxSize]="5"
      [boundaryLinks]="true"
      (pageChanged)="currentPage.next($event)"
    >
    </pagination>
  </div>
</div>
