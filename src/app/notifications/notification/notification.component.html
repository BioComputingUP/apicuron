<div class="tw-border tw-border-gray-500 tw-shadow-md tw-rounded-lg tw-px-2">
    <details class="group [&_summary::-webkit-details-marker]:tw-hidden">
        <summary class="tw-flex tw-flex-col tw-rounded-lg tw-px-4 tw-py-2 tw-text-gray-500 hover:tw-bg-gray-100 hover:tw-text-gray-700">
            <div class="tw-flex tw-cursor-pointer tw-items-center tw-justify-between">
                <span class="tw-text-base tw-font-medium">{{ notification.title }}</span>
                <div>
                    <span class="tw-text-xs tw-font-light">{{ notification.created_at.toDateString() }}</span>

                    <svg-icon src="assets/svg/chevron-right.svg"
                        svgClass="tw-rotate-90 tw-w-4 tw-h-4 tw-inline"></svg-icon>

                </div>

            </div>
            <div class="tw-flex tw-flex-row tw-justify-end tw-my-1 tw-justify-self-end">
                <button (click)="set_notification_as_seen(notification.id)" *ngIf="!notification.seen"
                    class="tw-bg-gray-300 tw-text-gray-800 tw-font-normal tw-p-1 tw-rounded">Mark as seen</button>
            </div>
        </summary>

        <nav aria-label="Notification Nav" class="tw-mt-2 tw-flex tw-flex-col tw-space-y-1 tw-px-4">
            <!-- <a href=""
                class="tw-block tw-rounded-lg tw-px-4 tw-py-2 tw-text-sm tw-font-medium tw-text-gray-500 hover:tw-bg-gray-100 hover:tw-text-gray-700">
                Banned Users
            </a>

            <a href=""
                class="tw-block tw-rounded-lg tw-px-4 tw-py-2 tw-text-sm tw-font-medium tw-text-gray-500 hover:tw-bg-gray-100 hover:tw-text-gray-700">
                Calendar
            </a> -->
            <pre class="tw-whitespace-pre-line tw-p-1 tw-mb-2 tw-bg-gray-200 tw-text-gray-700">
                {{ notification.body }}
            </pre>
        </nav>
    </details>
</div>
