<div class="tw-border tw-border-gray-500 tw-shadow-md tw-rounded-lg tw-px-2">
    <details class="group [&_summary::-webkit-details-marker]:tw-hidden" #details_elem>
        <summary
            class="tw-flex tw-flex-col tw-rounded-lg tw-px-4 tw-py-2 tw-text-gray-700 hover:tw-bg-gray-100 hover:tw-text-gray-700">
            <div class="tw-flex tw-cursor-pointer tw-items-center tw-justify-between">
                <div>
                    <span class="tw-text-base tw-font-normal">{{ notification.title }}</span>
                    <span class="tw-text-xs tw-font-light tw-ml-2">{{ dateTime }}</span>

                </div>
                <div class="tw-flex tw-items-center tw-gap-2">
                    <button
                        class="tw-bg-apicuron-purple tw-capitalize tw-text-gray-200 tw-font-bold tw-p-1 tw-rounded"
                        (click)="toggleVisibility()">
                        {{ toggle_text$ | async }}
                    </button>
                    <button (click)="set_notification_as_seen(notification.id)" *ngIf="!notification.seen"
                        class="tw-bg-gray-300 tw-text-gray-800 tw-font-bold tw-p-1 tw-rounded">Mark as seen
                    </button>

                    <button (click)="deleteNotification()" *ngIf="notification.seen"
                        class="tw-bg-red-500 tw-text-gray-100 tw-font-bold tw-p-1 tw-rounded">Delete
                    </button>
                </div>

            </div>
        </summary>

        <nav aria-label="Notification Nav" class="tw-mt-2 tw-flex tw-flex-col tw-space-y-1 tw-px-4">
            <pre class="tw-whitespace-pre-line tw-p-1 tw-mb-2 tw-bg-gray-200 tw-text-gray-700">
                {{ notification.body }}
            </pre>
        </nav>
    </details>
</div>
