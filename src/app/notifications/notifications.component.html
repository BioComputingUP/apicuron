<div class="main-content">
    <h2 class="tw-text-2xl tw-font-bold">Notifications</h2>
    <div class="tw-flex tw-flex-row tw-flex-wrap tw-w-full"
        *ngIf="notifications$ | async as notifications; else loadingOrError">

        <div class="tw-w-full tw-p-2" *ngFor="let notification of notifications">
            <notification [notification]="notification"></notification>
        </div>

        <ng-container *ngIf="!notifications || notifications.length === 0">
            <div class="tw-flex tw-flex-col tw-w-full tw-items-center">
                <img class="tw-w-1/3 tw-h-auto" src="assets/svg/no_data.svg" alt="">
                <span class="tw-block tw-text-lg tw-gray-800">You have no current notifications</span>
            </div>
        </ng-container>

    </div>

</div>

<ng-template #loadingOrError>

</ng-template>
