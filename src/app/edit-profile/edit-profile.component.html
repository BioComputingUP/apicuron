<form [formGroup]="pubmedForm">
  <div class="row">
    <div class="input-group mb-3 col-4">
      <div class="input-group-prepend">
        <span class="input-group-text text-center" style="width: 150px">First name*</span>
      </div>
      <input type="text" formControlName="firstname" class="form-control">
    </div>
    <div class="input-group mb-3 col-4">
      <div class="input-group-prepend">
        <span class="input-group-text text-center" style="width: 150px">Surname*</span>
      </div>
      <input type="text" formControlName="surname" class="form-control">
    </div>
    <div class="input-group mb-3 col-4">
      <div class="input-group-prepend">
        <span class="input-group-text text-center" style="width: 150px">ORCID iD*</span>
      </div>
      <input type="text" formControlName="orcid" class="form-control">
    </div>
  </div>
  <div class="row">
    <div class="input-group mb-3 col-4">
      <div class="input-group-prepend">
        <span class="input-group-text text-center" style="width: 150px">Organisation*</span>
      </div>
      <input type="text" formControlName="organization" class="form-control">
    </div>
    <div class="input-group mb-3 col-4 ">
      <div class="input-group-prepend">
        <span class="input-group-text text-center" style="width: 150px">Position*</span>
      </div>
      <input type="text" formControlName="position" class="form-control">
    </div>
    <div class="input-group mb-3 col-4">
      <div class="input-group-prepend">
        <span class="input-group-text text-center" style="width: 150px">Personal page</span>
      </div>
      <input type="text" formControlName="personal_page" class="form-control">
    </div>
  </div>
  <div class="row">
    <div class="input-group mb-3 col-8">
      <div class="input-group-prepend">
        <span class="input-group-text text-center" style="width: 150px"> Summary </span>
      </div>
      <textarea class="form-control" formControlName="summary" rows="1" placeholder=""></textarea>
    </div>
  </div>
  <input #file
         type="file"
         style="display: none"
         accept="image/*"
         (change)="onFilesAdded()">
  <div class="row" *ngIf="!imgURL || !profile_obj['profile_picture']">
    <div class="input-group mb-3 col-4 ">
      <div class="input-group-prepend">
        <span class="input-group-text text-center" style="width: 150px">Profile picture</span>
      </div>
      <div class="input-group-append">
        <button class="btn btn-outline-primary-input" (click)="addFiles()">
          add new profile picture
        </button>
      </div>
    </div>
  </div>
  <div class="row" *ngIf="imgURL || profile_obj['profile_picture']">
    <div class="col mb-3">
      <div class="input-group ">
        <div class="input-group-prepend">
          <span class="input-group-text text-center" style="width: 150px">Profile picture</span>
        </div>
        <div class="img-border">
          <!--<span>-->
            <!--<button class="btn btn-outline-danger no-border float-right">-->
              <!--X-->
            <!--</button>-->
          <!--</span>-->
          <span *ngIf="!imgURL">
            <img
              src="{{env.ws}}getProfilePicture/{{profile_obj['profile_picture']}}"
              class="logoimg p-2">
          </span>
          <span *ngIf="imgURL">
            <img [src]="imgURL" class="logoimg p-2">
          </span>
          <span>
            <button class="btn btn-outline-primary no-border btn-block float-left " (click)="addFiles()">
              upload other
            </button>
          </span>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="input-group mb-3 col-1">
      <button class="btn btn-outline-primary btn-block" (click)="sendData()">Save</button>
    </div>
    <div class="input-group mb-3 col-1">
      <button class="btn btn-outline-danger btn-block" routerLink="/profile/{{profile_obj['id']}}"> Leave edit
      </button>
    </div>
  </div>
</form>
