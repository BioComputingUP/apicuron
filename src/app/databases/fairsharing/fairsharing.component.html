<h3 class="tw-text-2xl tw-font-dm-sans tw-font-bold tw-my-2">
	Load the resource from FairSharing
</h3>

<div class="tw-flex tw-flex-row tw-pb-2 tw-items-center">
	<p class="tw-text-lg tw-font-bold tw-px-1">Paste a Resource DOI here</p>
	<div class="tw-flex tw-flex-row tw-px-2 sm:tw-w-1/3 tw-w-2/3">
		<input type="text"
			[(ngModel)]="doi"
			(change)="onDOIInputChange()"
			class="tw-block tw-w-full tw-grow tw-pl-2 disabled:tw-bg-gray-400 tw-rounded-l"
			placeholder="00.00000/FAIRsharing.aa0a00"
			value=""/>
		<button (click)="btnClick()"
			class="sm:tw-w-auto tw-w-1/3 tw-py-2 sm:tw-px-4 tw-bg-apicuron-bright-purple focus:tw-outline-none focus:tw-shadow-inner tw-text-gray-100 tw-px-2 tw-rounded-r"
			type="submit">Add</button>
	</div>
</div>
