<h3 class="tw-text-2xl tw-font-dm-sans tw-font-bold tw-my-2">
	Load the resource from FairSharing
</h3>

<div class="tw-flex tw-flex-row tw-pb-2 tw-items-center">
	<p class="tw-text-lg tw-font-bold tw-px-1">Paste a Resource DOI here</p>
	<div class="tw-flex tw-flex-row tw-px-2 sm:tw-w-1/3 tw-w-2/3">
		<input type="text"
			[(ngModel)]="doi"
			(change)="onDOIInputChange()"
			class="tw-block tw-w-full tw-grow tw-px-1 tw-py-2 disabled:tw-bg-gray-400 tw-rounded-l"
			placeholder="link format: 00.00000/FAIRsharing.aa0a00"
			value=""/>
		<button
			class="sm:tw-w-auto tw-w-1/3 tw-py-2 sm:tw-px-4 tw-bg-apicuron-bright-purple focus:tw-outline-none focus:tw-shadow-inner tw-text-gray-100 tw-px-2 tw-rounded-r"
			type="submit">Add</button>
	</div>
</div>
<div *ngIf="resource_data$ | async as resource_data">
	<h3 class="tw-text-2xl tw-font-bold tw-pb-2">Resource Data:</h3>
	<p class="tw-px-1 tw-font-bold">Resource ID: <span class="tw-font-normal">{{ resource_data.id }}</span></p>
	<p class="tw-px-1 tw-font-bold">Resource Name: <span class="tw-font-normal">{{ resource_data.name }}</span></p>
	<p class="tw-px-1 tw-font-bold">Resource URL: <span class="tw-font-normal">{{ resource_data.metadata.homepage }}</span></p>
	<p class="tw-px-1 tw-font-bold">Resource Description: <span class="tw-font-normal">{{ resource_data.metadata.description }}</span></p>
</div>
