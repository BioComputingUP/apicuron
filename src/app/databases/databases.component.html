<div class="container-fluid container-wide pt-3">
  <div class="row" *ngFor="let currResource of listResourcesDescriptions">
    <div class="col">
      <div class="card">
        <div class="card-body">
          <div class="row">
            <div class="col">
              <h2>{{currResource['resource_name']}}</h2>
            </div>
          </div>
          <div class="row">
            <div class="col">
              <span>{{currResource['resource_description']}}</span>
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-auto mr-3">
              <strong>Available medals:</strong>
            </div>
            <div class="col">
              <span class="badge badge-pill badge-des" *ngFor="let currBadge of currResource['badges']">
                <svg width="1.8em" height="1.8em" viewBox="0 0 16 16" class="bi bi-award-fill" [style]="{fill:currBadge['color_code'], 'font-size': 'large'}"
                     xmlns="http://www.w3.org/2000/svg">
  <path
    d="M8 0l1.669.864 1.858.282.842 1.68 1.337 1.32L13.4 6l.306 1.854-1.337 1.32-.842 1.68-1.858.282L8 12l-1.669-.864-1.858-.282-.842-1.68-1.337-1.32L2.6 6l-.306-1.854 1.337-1.32.842-1.68L6.331.864 8 0z"/>
  <path d="M4 11.794V16l4-1 4 1v-4.206l-2.018.306L8 13.126 6.018 12.1 4 11.794z"/>
</svg>
                {{currBadge['badge_name']}}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
