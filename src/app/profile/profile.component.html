<h3><strong>{{profileData.displayName}}</strong></h3>
<p>
  <strong>ORCID iD: </strong>{{profileData.orcd_id}}
</p>

<p>
  <strong>Number of entries: </strong>{{profileData.list_disprot_entries.length}}
</p>
<p>
  <strong>Number of terms: </strong>{{profileData.list_disprot_terms.length}}
</p>


<accordion>



  <accordion-group [isOpen]="false">
    <button class="btn btn-link btn-block clearfix" accordion-heading>
      <div class="pull-left float-left">Contributed proteins</div>
      <span class="float-right pull-right pl-2 pr-2" ><strong>Number of proteins: </strong>{{profileData.proteins.length}}</span>
      <!--<span class="float-right pull-right pl-2 pr-2"><strong>Number of terms: </strong>{{profileData.list_disprot_terms.length}}</span>-->
    </button>
    <app-proteins-detail-table [dataArray]="profileData.proteins"></app-proteins-detail-table>
  </accordion-group>
  <accordion-group [isOpen]="false" *ngFor="let database of profileData.contribution">
    <button class="btn btn-link btn-block clearfix" accordion-heading>
      <div class="pull-left float-left">Contribution in {{database.db_name}}</div>
      <span class="float-right pull-right pl-2 pr-2" ><strong>Number of entries: </strong>{{database.entries.length}}</span>
      <!--<span class="float-right pull-right pl-2 pr-2"><strong>Number of terms: </strong>{{profileData.list_disprot_terms.length}}</span>-->
    </button>
    <app-details-table [dataArray]="database.entries"></app-details-table>
  </accordion-group>


</accordion>
