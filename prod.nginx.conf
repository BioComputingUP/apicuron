
events {}
http{
    include /etc/nginx/mime.types;
    server {
    listen 8080;
    
    
    # Serve frontend static files
    location / {
        root /usr/share/nginx/html;
        index  index.html index.htm;

        try_files $uri $uri/ /index.html;

    }
    # Proxy API requests to backend
    location /api {
        proxy_pass http://apicuron-webserver:3000/;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Custom-Header';
            add_header 'Access-Control-Max-Age' 3600; # How long the preflight response can be cached (in seconds)
            return 204; # Respond with no content (success)
        }   

        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        rewrite ^/api(.*)$ $1 break;
    }

    # location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
    #         expires 1y;
    #         access_log off;
    #         add_header Cache-Control "public, immutable";
    #     }

}
}
