  server {
    listen 3000;
    listen [::]:3000;
    server_name localhost otrera;


    rewrite_log on;

    # For MinIO
    ignore_invalid_headers off;
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
      proxy_pass http://apicuron-ui:4200;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    #  Proxy to MinIO server

    location /storage/private {
      rewrite ^/storage/private(/.*)$ $1 break;

      # proxy_set_header Host pleiadi:9000;
      proxy_set_header Host $proxy_host;
      # proxy_set_header X-Real-IP $remote_addr;
      # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # proxy_set_header X-Forwarded-Proto $scheme;

      proxy_pass_header Authorization;
      proxy_pass_header X-Amz-Date;
      # proxy_pass_header Host;
      proxy_pass_header X-Amz-Expires;
      proxy_pass_header X-Amz-Signature;
      proxy_pass_header X-Amz-Access-Key-Id;

      proxy_connect_timeout 300;
      # Default is HTTP/1, keepalive is only enabled in HTTP/1.1
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      chunked_transfer_encoding off;

      proxy_pass http://pleiadi:9000;

      proxy_intercept_errors off;
    }


    # location /docs {
    #   proxy_pass http://apicuron-docs:4200;
    #   proxy_http_version 1.1;
    #   proxy_set_header Upgrade $http_upgrade;
    #   proxy_set_header Connection "upgrade";
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    location /api {
      proxy_pass http://apicuron-webserver:3000;

      proxy_read_timeout 300s;
      proxy_connect_timeout 75s;

      proxy_pass_request_headers on;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      rewrite ^/api(.*)$ $1 break;
      proxy_intercept_errors off;
    }

    # Hot proxy to documentation
    # location /docs/ {
    #   proxy_pass http://apicuron-docs:8080;
    #   proxy_http_version 1.1;
    #   proxy_set_header Upgrade $http_upgrade;
    #   proxy_set_header Connection "upgrade";
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # Hot reload for Documentation
    # location /sockjs-node/ {
    #   proxy_pass http://apicuron-docs:8080/sockjs-node/;
    #   proxy_http_version 1.1;
    #   proxy_set_header Upgrade $http_upgrade;
    #   proxy_set_header Connection "upgrade";
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }


    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
