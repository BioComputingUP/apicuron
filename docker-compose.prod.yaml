services:
  apicuron-webserver:
    container_name: apicuron-webserver
    image: registry.biocomputingup.it/apicuron-ws:prod
    # environment: # !! This one overrides any variables set inside env files listed in attribute `env_file` below
    #   - DATABASE_HOST=mongodb
    #   - DATABASE=apicuron
    #   - DB_PORT=27017
    #   - NODE_ENV=production
    env_file:
      - .env.production
    # env_file: # Add this if you want to override configuration
    #   - prod.env
    restart: "unless-stopped"
    depends_on:
      - mongodb

  
  apicuron-proxy-ui:
    image: registry.biocomputingup.it/apicuron-ui:prod    
    container_name: apicuron-proxy-ui
    # volumes:
    #   - ./prod.nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PORT:-8089}:8080"
    depends_on:
      - apicuron-webserver
  
  # Mongodb initialization service
  # Loads the init directory in volume
  mongo-init:
    container_name: apicuron-mongo-init
    build:
      context: ./mongo
    volumes:
      - mongo-init-vol:/docker-entrypoint-initdb.d
  # Database service
  mongodb:
    image: mongo
    container_name: apicuron-mongo
    restart: always
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
      - ./mongo/mongd.conf:/etc/mongod.conf:ro
      - mongo-init-vol:/docker-entrypoint-initdb.d/
    env_file:
      - .env.production
volumes:
  mongo-data:
    name: apicuron-mongo-data
  mongo-init-vol:
    name: apicuron-mongo-init
  
  
  


