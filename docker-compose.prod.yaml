services:
  apicuron-webserver:
    container_name: apicuron-webserver
    image: registry.biocomputingup.it/apicuron-ws:prod
    environment: # !! This one overrides any variables set inside env files listed in attribute `env_file` below
      - NODE_ENV=production
    # env_file: # Add this if you want to override configuration
    #   - prod.env
    restart: "unless-stopped"
      

  
  apicuron-proxy-ui:
    image: registry.biocomputingup.it/apicuron-ui:dev    
    container_name: apicuron-proxy-ui
    environment:
      - NODE_ENV=production
    volumes:
      - ./prod.nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PORT:-8089}:8080"
    depends_on:
      - apicuron-webserver
        

