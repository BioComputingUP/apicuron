version: "3.0"
services:
  apicuron-webserver:
    container_name: apicuron-webserver
    # image: registry.biocomputingup.it/apicuron-ws:latest
    image: apicuron-ws:latest
    build:
      context: "./apicuron-ws"
      target: production
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: "unless-stopped"
      

  
  apicuron-proxy:
  
    # image: registry.biocomputingup.it/apicuron-ui:latest

    # This is for the sake of debugging. use above image in production.
    image: apicuron-proxy:latest
    container_name: apicuron-proxy
    build:
      context: "./apicuron-ui"
      target: production
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    environment:
      - NODE_ENV=production
    volumes:
      - ./prod.nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PORT:-8089}:8080"
    depends_on:
      - apicuron-webserver
        

