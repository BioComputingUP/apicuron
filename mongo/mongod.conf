# ==============================================================================
# MONGODB PRODUCTION CONFIGURATION FILE (mongod.conf)
# Optimized for Docker Container Environments
# ==============================================================================

# ------------------------------------------------------------------------------
# Process Management
# ------------------------------------------------------------------------------
processManagement:
  # In Docker, the process must run in the foreground so the container doesn't exit.
  # Do NOT set fork: true here.
  fork: false
  pidFilePath: /var/run/mongodb/mongod.pid
  timeZoneInfo: /usr/share/zoneinfo

# ------------------------------------------------------------------------------
# Network Interfaces
# ------------------------------------------------------------------------------
net:
  # Port on which MongoDB listens for connections
  port: 27017
  # Bind to all interfaces (0.0.0.0) inside the container so external traffic 
  # routed via Docker network/host can reach it. Security MUST be enforced 
  # via authentication and network firewalls.
  bindIp: 0.0.0.0
  maxIncomingConnections: 65536
  wireObjectCheck: true
  compression:
    compressors: snappy,zstd

# ------------------------------------------------------------------------------
# Storage Engine (WiredTiger)
# ------------------------------------------------------------------------------
storage:
  dbPath: /data/db
  journal:
    enabled: true
    # Commit journal entries every 50ms (production default) to minimize data loss risk
    commitIntervalMs: 50
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      # CRITICAL FOR DOCKER: In production, explicitly set the cache size. 
      # By default, WiredTiger takes 50% of (RAM - 1GB). In a containerized environment,
      # if cgroups limits are not read properly, MongoDB might over-allocate and get OOM-killed.
      # Replace this value or ensure your container has sufficient headroom (e.g., 4GB for a 8GB container).
      cacheSizeGB: 1
      journalCompressor: snappy
      directoryForIndexes: true
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

# ------------------------------------------------------------------------------
# Security & Authentication
# ------------------------------------------------------------------------------
security:
  # Enforce authentication for all clients
  authorization: enabled
  # Path to the shared keyfile used for internal membership authentication across replica set members.
  # The file must have 600 permissions (chmod 600) and be owned by the mongodb user.
  # Un-comment the line below when enabling Replica Sets.
  # keyFile: /opt/mongodb/keyfile

# ------------------------------------------------------------------------------
# Operation Profiling
# ------------------------------------------------------------------------------
operationProfiling:
  # Log operations taking longer than 100ms
  slowOpThresholdMs: 100
  # Profile slow operations only (change to 'all' only for temporary deep debugging)
  mode: slowOp

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
systemLog:
  destination: file
  # Log to standard output so Docker log drivers (json-file, journald, splunk, etc.) 
  # can capture and aggregate logs natively. 
  # If you prefer a file inside the container, change path to /var/log/mongodb/mongod.log
  path: /proc/1/fd/1
  logAppend: true
  logRotate: reopen
  timeStampFormat: iso8601-utc
  verbosity: 0

# ------------------------------------------------------------------------------
# Replication (Optional - Uncomment and configure for High Availability)
# ------------------------------------------------------------------------------
# replication:
#   oplogSizeMB: 10240
#   replSetName: prod-repl-set
#   enableMajorityReadConcern: true

# ==============================================================================
# PRODUCTION DEPLOYMENT NOTES FOR DOCKER:
# 1. Ensure the host system has Transparent Huge Pages (THP) disabled:
#    echo never > /sys/kernel/mm/transparent_hugepage/enabled
#    echo never > /sys/kernel/mm/transparent_hugepage/defrag
# 2. Increase ulimits on the host machine/container runtime:
#    nofile (Open Files): 64000
#    nproc (Max Processes): 64000
# 3. Always mount host volumes or named volumes to `/data/db` to persist data.
# ==============================================================================